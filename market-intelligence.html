/* ══ Sparkline mini chart ══════════════════════════════════════ */
function Sparkline(props){
  var data=props.data||[];
  var color=props.color||C.accent;
  if(!data.length) return null;
  var vals=data.map(function(d){return d.v;});
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  var range=max-min || 1;
  var w=240,h=56,pad=4;
  var pts=data.map(function(d,i){
    var x=pad+(i/(data.length-1))*(w-2*pad);
    var y=h-pad-((d.v-min)/range)*(h-2*pad);
    return x+","+y;
  }).join(" ");
  var lastX=pad+(w-2*pad);
  var lastY=h-pad-((vals[vals.length-1]-min)/range)*(h-2*pad);
  return h_("svg",{width:"100%",height:h,viewBox:"0 0 "+w+" "+h,preserveAspectRatio:"none",style:{display:"block"}},
    h_("polyline",{points:pts,fill:"none",stroke:color,strokeWidth:2.5,strokeLinecap:"round",strokeLinejoin:"round"}),
    h_("circle",{cx:lastX,cy:lastY,r:4,fill:color,stroke:"#fff",strokeWidth:1.5})
  );
}
var h_=React.createElement; // alias to avoid shadow issues inside Sparkline

}

function caRegionGroup(p){if(p==="Québec")return"QC";if(p==="Ontario")return"ON";if(["Colombie-Britannique","Alberta","Saskatchewan","Manitoba","Yukon","Territoires du Nord-Ouest","Nunavut"].indexOf(p)>=0)return"West";return"Atlantic";}
var BRAND_REGION_FRAC={"Solenne":{QC:0.55,ON:0.22,West:0.15,Atlantic:0.08},"Norquay Canada":{QC:0.60,ON:0.1724,West:0.14,Atlantic:0.09},"Vireo":{QC:0.62,ON:0.18,West:0.13,Atlantic:0.07},"Ardent Heat":{QC:0.05,ON:0.28,West:0.55,Atlantic:0.12},"Regal Electric":{QC:0.06,ON:0.30,West:0.52,Atlantic:0.12},"Harlow/Qelvin":{QC:0.10,ON:0.38,West:0.40,Atlantic:0.12},"Vantar/Ventra":{QC:0.35,ON:0.35,West:0.22,Atlantic:0.08},"Meridian Electric":{QC:0.22,ON:0.40,West:0.30,Atlantic:0.08}};
function brandRegRev(b,grp){var fr=(BRAND_REGION_FRAC[b.name]||{})[grp];return (fr==null)?0:Math.round(b.revenue*fr*10)/10;}

nce.": "The displayed growth (« Blended Growth ») is the average of the weighted growth of the selected verticals and products. The forecast CAGR applies a prudence factor of 0.95 to this growth.", "Les hypothèses de prix, marges et élasticités sont indicatives et n'intègrent pas les remises négociées par compte.": "The price, margin, and elasticity assumptions are indicative and do not account for account-level negotiated discounts.", "On ajoute 1,8 % de la valeur totale des permis de construction de la province (StatCan), qui sert d'indicateur avancé de la demande non résidentielle (convecteurs, panneaux radiants, systèmes centraux).": "We add 1.8% of the province's total building permit value (StatCan), which serves as a leading indicator of non-residential demand (convectors, radiant panels, central systems).", "On ajoute 42 % de la base résidentielle pour représenter la demande de rénovation et de remplacement (le parc existant, non capté par les mises en chantier seules).": "We add 42% of the residential base to represent renovation and replacement demand (the existing stock, not captured by housing starts alone).", "Proportionnelle aux parts de canal ; le détail Retail est ventilé par enseigne (MaisonPro, Bricolex, Norbec…).": "Proportional to channel shares; the Retail detail is broken down by chain (MaisonPro, Bricolex, Norbec…).", "MaisonPro réduit son nombre d'UGS de chauffage électrique d'env. 15-20 % à l'échelle nationale. Les marques sans programme coopératif national sont à risque. Vireo est le plus exposé.": "MaisonPro is reducing its electric-heating SKU count by approx. 15-20% nationally. Brands without a national co-op program are at risk. Vireo is the most exposed.", "Un tarif américain de 25 % sur les produits canadiens crée un risque pour la parité de prix de Ardent et Regal Electric. À court terme, cela ouvre une fenêtre de prix, mais à long terme cela pourrait déclencher un approvisionnement à l'étranger.": "A 25% US tariff on Canadian goods creates a risk to the price parity of Ardent and Regal Electric. Short term it opens a pricing window, but long term it could trigger offshore sourcing.", "Dans cette démo, les parts par marque et les achats totaux sont des valeurs d'exemple inscrites à la main. Le seul calcul est l'addition : part Innovair = Solenne + Norquay + Vireo (ex. Corenet 14,2 + 6,8 + 2,4 = 23,4 %).": "In this demo, the per-brand shares and total purchases are hand-entered example values. The only calculation is the sum: Innovair share = Solenne + Norquay + Vireo (e.g., Corenet 14.2 + 6.8 + 2.4 = 23.4%)."});

n the taxonomy.", "Valeurs affichées telles quelles (non calculées), avec variation et mini-courbe. Les couleurs ▲/▼ sont cadrées du point de vue d'Innovair (ex. gaz en hausse = favorable au chauffage électrique).": "Values shown as-is (not calculated), with change and mini-chart. The ▲/▼ colours are framed from Innovair's perspective (e.g., gas rising = favorable to electric heating).", "« Next Competitor » (Meridian 9,2 %, plus gros concurrent hors Innovair) et « Price Premium +5 à +12 % » (dérivé de l'indice de prix : marques Innovair au-dessus des marques d'entrée US comme Ardent 75 / King 72).": "« Next Competitor » (Meridian 9.2%, largest competitor outside Innovair) and « Price Premium +5 to +12% » (derived from the price index: Innovair brands above US entry brands like Ardent 75 / King 72).", "base 100 = prix catalogue plinthe standard Solenne (T1 2024) ; chaque cellule = prix relatif à cette base ; un indice plus bas = moins cher.": "base 100 = Solenne standard baseboard list price (Q1 2024); each cell = price relative to that base; a lower index = cheaper.", "base 100 = prix de référence (plinthe standard Solenne, T1 2024). Un indice < 100 = moins cher que la référence ; > 100 = plus cher. Ce n'est pas calculé dans l'app — c'est un relevé stocké par trimestre.": "base 100 = reference price (Solenne standard baseboard, Q1 2024). An index < 100 = cheaper than the reference; > 100 = more expensive. It is not calculated in the app — it is a stored survey per quarter.", "les marques Innovair (Norquay +12, Solenne +5) se situent au-dessus des marques d'entrée US (Ardent 75, King 72), soit un premium d'environ +5 à +12 %.": "Innovair brands (Norquay +12, Solenne +5) sit above US entry brands (Ardent 75, King 72), i.e., a premium of roughly +5 to +12%.", "veille réglementaire (codes du bâtiment, mandats VRC/thermopompe, subventions comme Canada Sundaner Homes) et annonces concurrentes / presse sectorielle.": "regulatory watch (building codes, HRV/heat-pump mandates, subsidies like Canada Sundaner Homes) and competitor announcements / trade press.", "Panels de distribution, HRAI, rapports annuels, études syndiquées": "Distribution panels, HRAI, annual reports, syndicated studies", "toutes ces valeurs sont des données d'exemple. La structure (formules, seuils, indice de prix, signaux) est réelle et réutilisable ; les chiffres sont à remplacer par vos données de ventes, vos données distributeurs et votre veille.": "all these values are example data. The structure (formulas, thresholds, price index, signals) is real and reusable; the figures should be replaced with your sales data, your distributor data, and your market watch.", "Les valeurs affichées (parts de marché, revenus des comptes, pipeline, indicateurs macro) sont des": "The displayed values (market shares, account revenues, pipeline, macro indicators) are", ", calibrées pour ressembler à la réalité. Ce ne sont": ", calibrated to resemble reality. They are", "À gauche, les évènements réglementaires et concurrentiels à suivre, séparés en opportunités (vert) et risques (rouge), chacun avec un niveau d'urgence, un impact et un horizon. À droite, les parts de marché par marque (les marques Innovair sont surlignées « NOUS »).": "On the left, the regulatory and competitive events to watch, split into opportunities (green) and risks (red), each with an urgency level, an impact, and a horizon. On the right, market shares by brand (Innovair brands are highlighted « US »).", "Cinq indicateurs macro (électricité, gaz, permis résidentiels, permis commerciaux, change USD/CAD) avec mini-courbes. Les permis sont exprimés en quantité (logements autorisés · permis émis) et comparés à l'an dernier. Les couleurs sont cadrées du point de vue d'Innovair : par exemple, un prix du gaz en hausse s'affiche en vert car il renforce la compétitivité du chauffage électrique. En bas, des cartes mènent aux onglets détaillés.": "Five macro indicators (electricity, gas, residential permits, commercial permits, USD/CAD FX) with mini-charts. Permits are expressed in quantity (dwelling units authorized · permits issued) and compared to last year. The colours are framed from Innovair's perspective: for example, a rising gas price shows green because it strengthens electric heating competitiveness. At the bottom, cards lead to the detailed tabs.", "Les données d'exemple sont calibrées à partir de ces sources publiques. Pour un usage opérationnel, ce sont les flux à brancher en remplacement des tableaux internes.": "The example data is calibrated from these public sources. For operational use, these are the feeds to connect in place of the internal tables.", "SCHL — Perspectives du marché de l'habitation": "CMHC Housing Market Outlook", "Données sectorielles HRAI": "HRAI Industry Data", "Institut du chauffage, de la réfrigération et de la climatisation du Canada (HRAI)": "Heating, Refrigeration & Air Conditioning Institute of Canada", "Le CAD s'est légèrement affaibli face au USD ces derniers mois. Un taux CAD/USD plus élevé augmente le coût rendu des composants et produits finis d'origine américaine (Ardent, Regal Electric, Harlow) — ce qui améliore la compétitivité-prix relative des produits canadiens Solenne/Norquay/Vireo.": "The CAD has weakened slightly against the USD in recent months. A higher CAD/USD rate increases the landed cost of US-sourced components and finished goods (Ardent, Regal Electric, Harlow) — improving the relative price competitiveness of Canadian-made Solenne/Norquay/Vireo products.", "Valeur nationale des permis au plus haut depuis 18 mois. L'Alberta mène la croissance (+11,4 %), portée par l'afflux de population. Le Québec affiche une forte reprise (+7,8 %) — les deux provinces sont des cibles prioritaires pour les programmes de prescription d'Innovair.": "National permit value at its highest in 18 months. Alberta leads growth (+11.4%), driven by population inflows. Quebec shows a strong recovery (+7.8%) — both provinces are priority targets for Innovair's specification programs.", "Statistique Canada, tableau 34-10-0035-01 — construction non résidentielle, investissement mensuel": "Statistics Canada Table 34-10-0035-01, non-residential building construction, monthly investment"});

Object.assign(DICT_FR2EN,{"Définition des segments de marché": "Market segment definitions", "Définition des segments": "Segment definitions", "Chauffage par résistance électrique (effet Joule) : plinthes électriques, convecteurs, panneaux radiants, aérothermes / ventilo-convecteurs électriques, plinthes hydroniques électriques et fournaises électriques à résistance, incluant les thermostats associés. Exclut les thermopompes et tout chauffage à combustion (gaz, mazout, bois).": "Electric resistance heating (Joule effect): electric baseboards, convectors, radiant panels, electric unit heaters/fan-coils, electric hydronic baseboards, and resistive electric furnaces, including associated thermostats. Excludes heat pumps and all combustion heating (gas, oil, wood).", "Chauffage, ventilation et climatisation — ici, la ventilation et le traitement d'air : ventilateurs récupérateurs de chaleur/d'énergie (VRC/VRE — HRV/ERV), échangeurs d'air, climatisation centrale et systèmes de ventilation résidentiels et commerciaux. La fonction de chauffage par thermopompe est comptée séparément dans le segment Thermopompe pour éviter le double comptage.": "Heating, ventilation and air conditioning — here, ventilation and air handling: heat/energy recovery ventilators (HRV/ERV), air exchangers, central air conditioning, and residential and commercial ventilation systems. The heat-pump heating function is counted separately in the Heat Pump segment to avoid double counting.", "Thermopompes à air (aérothermie / air-source) : thermopompes murales sans conduit (mini-splits ductless), thermopompes centrales à air, et thermopompes pour climat froid (cold-climate). C'est le segment d'électrification à plus forte croissance. Exclut la géothermie (air-eau/sol-eau), qui n'est pas modélisée ici.": "Air-source heat pumps: ductless wall-mounted heat pumps (mini-splits), central air heat pumps, and cold-climate heat pumps. This is the fastest-growing electrification segment. Excludes geothermal (air-water/ground-water), which is not modeled here.", "Plinthes, convecteurs, panneaux radiants, aérothermes & fournaises électriques": "Baseboards, convectors, radiant panels, unit heaters & electric furnaces", "Comment lire chaque section du tableau de bord, d'où proviennent les chiffres, et lesquels sont calculés par le modèle. À lire avant toute prise de décision fondée sur ces données.": "How to read each section of the dashboard, where the figures come from, and which are computed by the model. Read before making any decision based on this data.", "Chiffres calculés par le modèle (vs valeurs brutes)": "Figures computed by the model (vs raw values)", "Six chiffres clés en un coup d'œil : cinq indicateurs de marché — Chauffage résistif, CVAC, Thermopompe, câble de plancher et câble de spécialité (voir définitions ci-dessous) — plus le taux directeur de la Banque du Canada. Un sélecteur permet de filtrer les segments par province ou de voir l'ensemble du pays. Les pastilles ▲/▼ indiquent la croissance annuelle ; les mini-courbes montrent l'évolution récente.": "Six key figures at a glance: five market indicators — Resistive Heating, HVAC, Heat Pump, floor cable and specialty cable (see definitions below) — plus the Bank of Canada policy rate. A selector lets you filter the segments by province or view the whole country. The ▲/▼ pills show annual growth; the mini-charts show the recent trend.", "Les valeurs affichées (parts de marché, revenus des comptes, pipeline, indicateurs macro) sont des ": "The displayed values (market shares, account revenues, pipeline, macro indicators) are ", "données d'exemple inscrites dans l'application": "example data written into the application", "pas des flux en direct": "not live feeds", ", calibrées pour ressembler à la réalité. Ce ne sont ": ", calibrated to resemble reality. They are ", ", elles ne sont ni vérifiées ni mises à jour automatiquement. La structure, les formules et les sources citées sont réelles ; les nombres sont simulés à des fins de démonstration.": ", they are neither verified nor updated automatically. The structure, formulas, and cited sources are real; the numbers are simulated for demonstration purposes.", "Données illustratives — démonstration": "Illustrative data — demonstration", "Vue d'ensemble macroéconomique mise à jour mensuellement — ces huit indicateurs influencent directement la demande, les coûts et la rentabilité du chauffage électrique au Canada. Chaque carte indique la variation vs le mois précédent et vs la même période l'an dernier. Consultez l'onglet Market Intelligence pour l'analyse détaillée par marché.": "Macroeconomic overview updated monthly — these eight indicators directly influence demand, costs, and profitability of electric heating in Canada. Each card shows the change vs the previous month and vs the same period last year. See the Market Intelligence tab for detailed by-market analysis.", "Vue d'ensemble macroéconomique": "Macroeconomic overview", "Vs même période l'an dernier:": "Vs same period last year:", "unités autorisées vs l'an dernier": "units authorized vs last year", "permis émis vs l'an dernier": "permits issued vs last year", "Mises en chantier (k)": "Housing starts (k)", "Estimation du marché canadien (2025) pour les deux nouvelles catégories de câbles chauffants, dérivée du modèle de dimensionnement (famille chauffage résistif). Valeurs illustratives.": "Canadian market estimate (2025) for the two new heating-cable categories, derived from the sizing model (resistive heating family). Illustrative values.", "L'onglet repose sur quatre jeux de données internes (illustratifs) : marques & concurrents (COMP_BRANDS), part de portefeuille par distributeur (WALLET_SHARE), indice de prix trimestriel (PRICE_TIMELINE) et signaux (SIGNALS). Trois sous-onglets : Market Landscape, Wallet Share, Market Signals. La plupart des chiffres sont des champs stockés ; seuls quelques-uns sont calculés (détaillés ci-dessous).": "This tab is built on four internal (illustrative) datasets: brands & competitors (COMP_BRANDS), wallet share by distributor (WALLET_SHARE), quarterly price index (PRICE_TIMELINE) and signals (SIGNALS). Three sub-tabs: Market Landscape, Wallet Share, Market Signals. Most figures are stored fields; only a few are calculated (detailed below).", "Les signaux ne sont pas calculés : c'est une liste organisée manuellement (veille). Chaque signal porte cinq attributs, utilisés tels quels pour l'affichage et le tri :": "Signals are not calculated: it's a manually curated list (market watch). Each signal has five attributes, used as-is for display and sorting:", "opportunité (vert) ou risque (rouge) — détermine la colonne et la couleur": "opportunity (green) or risk (red) — determines the column and colour", "High / Medium — pilote la pastille d'urgence": "High / Medium — drives the urgency pill", "impact estimé (texte)": "estimated impact (text)", "libellé, description et pictogramme du signal": "the signal's label, description, and icon", "les mêmes signaux alimentent le bloc « Signaux du marché » du tableau de bord (répartition opportunités / risques avec pastille d'urgence).": "the same signals feed the dashboard « Market Signals » block (opportunities / risks split with an urgency pill).", "Réutilisation : ": "Reuse: ", "Veille réglementaire (codes du bâtiment, mandats VRC/thermopompe) + annonces concurrentes": "Regulatory watch (building codes, HRV/heat-pump mandates) + competitor announcements", "Relevés de prix catalogue / liste": "Catalogue / list price surveys", "Données distributeur / panel de distribution": "Distributor data / distribution panel", "Données de détail": "Retail data", "Vos ventes ÷ achats totaux du distributeur (déclaratif ou panel)": "Your sales ÷ distributor's total purchases (self-reported or panel)", "les parts par marque et les achats totaux ($M) sont des champs ": "the per-brand shares and total purchases ($M) are ", ". En usage réel : numérateur (vos achats par le distributeur, par marque) = votre ERP/ventes ; dénominateur (achats totaux de chauffage électrique du distributeur) = panel de distribution ou déclaratif du distributeur. Le dénominateur n'est pas public, d'où l'absence de source ouverte pour ce chiffre.": ". In real use: numerator (your purchases through the distributor, by brand) = your ERP/sales; denominator (the distributor's total electric-heating purchases) = distribution panel or the distributor's self-reporting. The denominator is not public, hence the absence of an open source for this figure.", "achats totaux chauffage élec. du distributeur": "distributor's total electric-heating purchases", "(chaque marque = sa part des achats du distributeur)": "(each brand = its share of the distributor's purchases)", "Barres de part : ": "Share bars: ", "Indice de prix : ": "Price index: ", "Indice de prix": "Price index", "Cible & repère : ": "Target & benchmark: ", "passer de 14–35 % actuellement vers 40 %+ sur les comptes clés ; 30 %+ = seuil « préféré » du secteur.": "grow from 14–35% currently toward 40%+ in key accounts; 30%+ = industry « preferred » threshold.", "≥ 30 % vert (statut fournisseur privilégié) · ≥ 20 % orange · < 20 % rouge. Largeur de barre = innovairShare %.": "≥ 30% green (preferred vendor status) · ≥ 20% orange · < 20% red. Bar width = innovairShare %.", "Pistes générées à partir du modèle et de la veille, ": "Leads generated from the model and market watch, ", "adaptées au périmètre sélectionné dans l'Intelligence de marché.": "adapted to the scope selected in Market Intelligence.", "à priorité haute": "high priority", "Définitions détaillées de chaque canal et vertical utilisés dans l'analyse — qui ils regroupent, qui achète, et les indicateurs clés.": "Detailed definitions of each channel and vertical used in the analysis — who they include, who buys, and the key metrics.", "Marchés verticaux — catalogue": "Market Verticals — catalogue", "Marchés verticaux": "Market Verticals", "Taxonomie des vince": "Housing starts, completions & construction permits by province", "Permis de construction résidentiels & commerciaux (É.-U.)": "US residential & commercial building permits", "Données sur le combustible et les équipements de chauffage résidentiel (É.-U.)": "US residential heating fuel & equipment data", "Statistique Canada, tableau 34-10-0035-01 — construction non résidentielle, investissement mensuel": "Statistics Canada Table 34-10-0035-01, non-residential building construction, monthly investment", "Tendance clé du marché": "Key Market Trend", "Élasticité": "Elasticity", "Pénétration": "Penetration", "Pénétration élec.": "Elec. penetration", "Pénétration électrique ": "Electric penetration ", "Composé annuel": "Compound annual", "Créer un outil de prescription pour entrepreneurs intégrant un sélecteur de produits et les données d'activité de permis locales": "Build a contractor specification tool integrating a product selector with local permit activity data", "Proposer un programme de tête de gondole pour le panneau radiant — occasion de saison de rénovation": "Propose a Radiant Panel endcap program — renovation season opportunity"});
Object.assign(DICT_FR2EN,{"Ce tableau de bord repose sur un modèle descendant (top-down) ancré aux mises en chantier et à la valeur des permis de construction. Cette page documente intégralement les sources, les formules de dimensionnement du marché, le modèle de prévision sur 3 ans, les hypothèses clés et les limites de précision. Toutes les formules ci-dessous reflètent exactement les calculs exécutés par l'application.": "This dashboard is built on a top-down model anchored to housing starts and building permit values. This page fully documents the sources, the market sizing formulas, the 3-year forecast model, the key assumptions, and the accuracy limits. All formulas below reflect exactly the calculations executed by the application.", "Vue d'ensemble du dimensionnement du marché": "Market sizing overview", "Sizing par région & produit": "Sizing by region & product", "Sizing par région, vertical, canal et produit — ancré sur les données CMHC.": "Sizing by region, vertical, channel, and product — anchored on CMHC data.", "Croissance & CAGR": "Growth & CAGR", "Répartition (split) du marché": "Market split", "Limites & précision": "Limits & accuracy", "Niveaux de confiance": "Confidence levels", "Sources de données primaires": "Primary data sources", "Sources réelles utilisées comme référence": "Real sources used as reference", "Pondération par vertical": "Weighting by vertical", "Croissance annuelle": "Annual growth", "Élément": "Item", "Définition": "Definition", "Calculé · Stocké · Source réelle": "Calculated · Stored · Real source", "Champ stocké": "Stored field", "Champ stocké (SIGNALS)": "Stored field (SIGNALS)", "Champ stocké (totalBuying)": "Stored field (totalBuying)", "Champ stocké par marque": "Stored field per brand", "Champ stocké par trimestre": "Stored field per quarter", "KPI calculé : ": "Calculated KPI: ", "KPI saisis (non calculés) : ": "Entered KPIs (not calculated): ", "Dérivé (aucune saisie directe)": "Derived (no direct entry)", "Source réelle (usage opérationnel)": "Real source (operational use)", "Saisi vs calculé & source réelle : ": "Entered vs calculated & real source: ", "✓ Cohérence : ": "✓ Consistency: ", "Mises × %Élec × RevMoy × AjustAnnée": "Starts × ElecPct × AvgRev × YearAdj", "K mises en chantier utilisées comme base": "K permit starts used as base", "Base de permis": "Permit Base", "Base de construction neuve (résidentiel)": "New construction base (residential)", "Mises en chantier × pénétration électrique × prix moyen (680 $), + 42 % rénovation, + composante commerciale (1,8 % des permis).": "Housing starts × electric penetration × average price ($680), + 42% renovation, + commercial component (1.8% of permits).", "Mises en chantier × taux d'équipement ventilation/AC (55 %) × prix moyen (2 400 $), + composante commerciale (1,1 % des permis).": "Housing starts × ventilation/AC equipment rate (55%) × average price ($2,400), + commercial component (1.1% of permits).", "Mises en chantier × taux d'adoption (18 % + jusqu'à 25 % là où le gaz domine) × prix moyen installé (5 200 $).": "Housing starts × adoption rate (18% + up to 25% where gas dominates) × average installed price ($5,200).", "Pour chaque province sélectionnée, on part des mises en chantier CMHC (en milliers d'unités), pondérées par le taux de pénétration du chauffage électrique de la province, multipliées par une valeur moyenne installée de 680 $ par unité neuve.": "For each selected province, we start from CMHC housing starts (in thousands of units), weighted by the province's electric heating penetration rate, multiplied by an average installed value of $680 per new unit.", "La valeur agrégée est projetée vers l'année de référence choisie à un taux composé de 3,8 %/an depuis 2024 (base CMHC).": "The aggregated value is projected to the chosen reference year at a compound rate of 3.8%/yr since 2024 (CMHC base).", "Le marché total est multiplié par la somme des parts des verticaux sélectionnés. Sélectionner les 5 verticaux = ×1,0 (les parts somment à 100 %) ; en sélectionner moins réduit proportionnellement le périmètre.": "The total market is multiplied by the sum of the selected verticals' shares. Selecting all 5 verticals = ×1.0 (shares sum to 100%); selecting fewer proportionally reduces the scope.", "Proportionnelle aux mises en chantier de chaque province sur le total sélectionné.": "Proportional to each province's housing starts over the selected total.", "Proportionnelle aux parts de marché de chaque vertical (voir onglet Hypothèses).": "Proportional to each vertical's market share (see Assumptions tab).", "Proportionnelle aux parts produit ; les unités = valeur ÷ prix moyen du produit.": "Proportional to product shares; units = value ÷ product average price.", "Croissance propre au segment ; le résistif reprend la moyenne pondérée verticaux/produits du modèle.": "Segment-specific growth; resistive uses the model's verticals/products weighted average.", "Les trois segments sont calculés avec le MÊME moteur que l'analyse détaillée (computeMarket) : le marché total est réparti par produit, puis les produits sont regroupés en trois segments. Le segment « Thermopompe » du tableau de bord égale donc exactement la somme des thermopompes de la ventilation par produit. La croissance de chaque segment = moyenne pondérée (par valeur) de la croissance de ses produits.": "The three segments are computed with the SAME engine as the detailed analysis (computeMarket): the total market is split by product, then products are grouped into three segments. The dashboard « Heat Pump » segment therefore equals exactly the sum of the heat pumps in the by-product breakdown. Each segment's growth = value-weighted average of its products' growth.", "Les trois segments sont dérivés par le modèle descendant à partir des mises en chantier et des permis, filtrables par province. Le détail complet des formules se trouve dans l'onglet Méthodologie.": "The three segments are derived by the top-down model from housing starts and permits, filterable by province. Full formula detail is in the Methodology tab.", "Somme des unités d'habitation autorisées par province ; comparaison en % vs l'an dernier (LY).": "Sum of dwelling units authorized per province; % comparison vs last year (LY).", "Nombre de permis non résidentiels émis ; comparaison en % vs l'an dernier.": "Number of non-residential permits issued; % comparison vs last year.", "Précision estimée de la taille de marché : ±10–15 %.": "Estimated market-size accuracy: ±10–15%.", "Modèle descendant — pas de données de ventes réelles point par point ; les splits reposent sur des parts moyennes.": "Top-down model — no point-by-point real sales data; splits rely on average shares.", "Les données macro (taux, FX, permis) sont mensuelles et peuvent décaler de la réalité terrain.": "Macro data (rates, FX, permits) are monthly and may lag on-the-ground reality.", "Les projets de prévision supposent une structure de marché stable (pas de choc réglementaire ou tarifaire majeur non modélisé).": "Forecast projections assume a stable market structure (no major unmodeled regulatory or tariff shock).", "Élevée — ancrée permis CMHC": "High — CMHC permit-anchored", "Moyenne-élevée": "Medium-High", "Plus de 3 régions sélectionnées": "More than 3 regions selected"});

Object.assign(DICT_FR2EN,{"Les canaux de marché décrivent COMMENT les produits d'Innovair atteignent les utilisateurs finaux — le chemin du fabricant jusqu'à l'installation finale. Chaque canal a des types d'acheteurs, des profils de marge et des dynamiques de croissance distincts. La stratégie de canal détermine le pouvoir de fixation des prix, le positionnement de marque et le mix de revenus.": "Market channels describe HOW Innovair's products reach end users — the route-to-market path from manufacturer to final installation. Each channel has distinct buyer types, margin profiles, and growth dynamics. Channel strategy determines pricing power, brand positioning, and revenue mix.", "Les verticaux de marché décrivent OÙ les produits d'Innovair sont utilisés — le segment d'usage final ou le type de bâtiment. Les verticaux déterminent quels produits sont requis, qui les prescrit, et quels règlements et programmes s'appliquent. Le dimensionnement repose sur les données de permis de construction SCHL segmentées par type de bâtiment.": "Market verticals describe WHERE Innovair's products are used — the end-use segment or building type. Verticals determine which products are needed, who specifies them, and which regulations and programs apply. Market sizing is based on CMHC construction permit data segmented by building type.", "Grossistes B2B spécialisés qui stockent et vendent des produits électriques exclusivement aux entrepreneurs licenciés, électriciens et acheteurs commerciaux. Ils tiennent un inventaire technique approfondi et offrent des conditions de crédit.": "Specialized B2B wholesalers that stock and sell electrical products exclusively to licensed contractors, electricians, and commercial buyers. They carry deep technical inventory and provide credit terms.", "Chaînes de détail à grande surface vendant des produits de chauffage aux consommateurs bricoleurs, petits entrepreneurs et acheteurs de rénovation. Axées sur le prix, gros volumes, profondeur d'UGS moindre que les distributeurs.": "Large-format retail chains selling heating products to DIY consumers, small contractors, and renovation buyers. Price-driven, high-volume, lower SKU depth than distributors.", "Spécialistes du chauffage, de la ventilation et de la climatisation qui achètent l'équipement directement pour installation dans des projets résidentiels et commerciaux. Canal en croissance porté par les exigences en thermopompes et VRE/VRC.": "Heating, ventilation, and air conditioning specialists who purchase equipment directly for installation in residential and commercial projects. Growing channel driven by heat pump and ERV/HRV mandates.", "Plateformes en ligne et places de marché numériques où les produits de chauffage sont achetés sans interaction en personne. Canal à plus forte croissance à partir d'une base modeste, surtout des produits d'entrée et de milieu de gamme.": "Online platforms and digital marketplaces where heating products are purchased without in-person interaction. Fastest-growing channel from a small base, primarily entry and mid-tier products.", "Ventes directes du fabricant à des acheteurs de gros volume, promoteurs, ou produits prescrits par des architectes et ingénieurs. Contourne la distribution. Relations à forte valeur avec de longs cycles de vente.": "Manufacturer direct sales to large-volume buyers, developers, or products specified by architects and engineers. Bypasses distribution. High-value relationships with long sales cycles.", "Maisons unifamiliales neuves, maisons en rangée et immeubles résidentiels multi-logements de faible hauteur (condos, appartements) en construction. Piloté par les données de mises en chantier SCHL. Le chauffage électrique est prescrit à la phase de construction.": "New single-family homes, townhouses, and low-rise multi-unit residential buildings (condos, apartments) under construction. Driven by CMHC housing starts data. Electric heating is specified at the construction phase.", "Immeubles de bureaux, espaces de détail, entrepôts et structures commerciales de moyenne à grande hauteur. Le chauffage électrique est prescrit par des ingénieurs mécaniques. Cycles de vente plus longs avec des valeurs unitaires plus élevées.": "Office buildings, retail spaces, warehouses, and mid-to-high-rise commercial structures. Electric heating is specified by mechanical engineers. Longer sales cycles with higher unit values.", "Amélioration, remplacement ou ajout de systèmes de chauffage dans les bâtiments résidentiels et commerciaux existants. Vertical à plus forte croissance, porté par Canada Sundaner Homes, le vieillissement du parc et les exigences d'électrification remplaçant les systèmes au gaz.": "Upgrading, replacing, or adding heating systems in existing residential and commercial buildings. Fastest-growing vertical, driven by Canada Sundaner Homes, aging housing stock, and electrification mandates replacing gas systems.", "Usines, usines de transformation, entrepôts et installations industrielles nécessitant du chauffage ponctuel, une protection contre le gel ou du chauffage de procédé. Pénétration plus faible mais valeurs unitaires élevées et achats en gros.": "Factories, processing plants, warehouses, and industrial facilities requiring spot heating, freeze protection, or process heating. Lower penetration but high unit values and bulk purchasing.", "Hôtels, complexes, hôpitaux, centres de soins de longue durée, cliniques et établissements d'enseignement. Nécessite un chauffage fiable, silencieux et conforme aux codes, avec contrôle indépendant par pièce. Normes de prescription élevées.": "Hotels, resorts, hospitals, long-term care homes, clinics, and educational institutions. Requires reliable, quiet, code-compliant heating with independent room control. High specification standards.", "Part de portefeuille = revenu Innovair en % des achats totaux de chauffage électrique du distributeur. Cible : passer de 14-35 % actuellement vers 40 %+ sur les comptes clés. Le repère sectoriel du statut de fournisseur privilégié est de 30 %+": "Wallet share = Innovair revenue as % of total distributor electric heating purchases. Target: grow from current 14-35% toward 40%+ in key accounts. Industry benchmark for preferred vendor status is 30%+", "★ Dernier trimestre. Indice 100 = prix catalogue de la plinthe standard Solenne. Un indice plus bas = prix plus bas que Solenne.": "★ Latest quarter. Index 100 = Solenne standard baseboard list price. Lower index = lower price relative to Solenne.", "Exigence VRE/VRC — CNB 2020": "NBC 2020 ERV/HRV Mandate", "Exigence d'électrification QC — Loi 96": "QC Electrification Mandate — Bill 96", "Déplacement par la thermopompe — segment plinthe": "Heat Pump Displacement — Baseboard Segment", "Canada Sundaner Homes — volet thermopompe": "Canada Sundaner Homes — Heat Pump Stream", "Santé & sciences de la vie": "Healthcare & Lifesciences", "Finance, banque & assurance (FinTech & InsurTech)": "Finance, Banking & Insurance (FinTech & InsurTech)", "Ressources naturelles, mines & foresterie": "Natural Resources, Mining & Forestry", "Agriculture & agroalimentaire (AgTech)": "Agriculture & Agri-Food (AgTech)", "Transport, logistique & chaîne d'approvisionnement": "Transportation, Logistics & Supply Chain", "Immobilier, construction & PropTech": "Real Estate, Construction & PropTech", "Éducation & secteur public (EdTech & GovTech)": "Education & Public Sector (EdTech & GovTech)", "Entrée de gamme": "Entry", "Entrée-milieu": "Entry-Mid", "Milieu de gamme": "Mid", "Haut de gamme": "Premium", "En déclin": "Declining", "En croissance": "Growing", "Stable": "Stable", "Part des marques combinée": "Combined brand share", "Moteurs du marché": "Market Drivers", "Risques du marché": "Market Risks"});

/* ═══════════════════════════════════════════════════════════════════
   BARRIÈRE D'ACCÈS (mot de passe) — côté client uniquement.
   Dissuasion, PAS une vraie sécurité : quelqu'un qui inspecte le JS
   peut retrouver GATE_HASH. Suffisant pour éviter l'indexation aléatoire,
   pas pour du contenu sensible. (Les données sous-jacentes sont publiques.)

   POUR CHANGER LE MOT DE PASSE — régénérez le hash SHA-256 et remplacez GATE_HASH :
     • Terminal :   echo -n "NouveauMotDePasse" | shasum -a 256
     • Console navigateur :
         crypto.subtle.digest("SHA-256", new TextEncoder().encode("NouveauMotDePasse"))
           .then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")));
   Mot de passe actuel : Portfolio2026  (À CHANGER avant publication)
   ═══════════════════════════════════════════════════════════════════ */
var GATE_HASH="c0073cb620c0322d00e0b42b09a0275dc624c928964a85c89bf62245fdd947e5";

function runApp(){
  var root=ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(App));
}

function _hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,"0");}).join("");}

function _mkGate(){
  var wrap=document.createElement("div");
  wrap.id="mi-gate";
  wrap.style.cssText="position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#0F2544 0%,#1E3A5F 100%);display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;";
  var card=document.createElement("div");
  card.style.cssText="background:#fff;border-radius:18px;padding:38px 34px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.4);text-align:center;box-sizing:border-box;";
  card.innerHTML="<div style='font-size:32px;margin-bottom:8px;'>🔒</div><h1 style='margin:0 0 4px;font-size:20px;font-weight:800;color:#0F2544;'>Accès protégé</h1><p style='margin:0 0 22px;font-size:12.5px;color:#64748B;line-height:1.55;'>Intelligence de marché — Innovair<br>Protected access · enter the password to continue</p>";
  var inp=document.createElement("input");
  inp.type="password"; inp.autocomplete="off"; inp.placeholder="Mot de passe / Password";
  inp.style.cssText="width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid #E2E8F0;border-radius:10px;font-size:15px;color:#0F2544;outline:none;margin-bottom:12px;";
  inp.onfocus=function(){inp.style.borderColor="#F4820A";};
  inp.onblur=function(){inp.style.borderColor="#E2E8F0";};
  var btn=document.createElement("button");
  btn.textContent="Entrer / Enter";
  btn.style.cssText="width:100%;padding:12px;background:#F4820A;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(244,130,10,0.35);";
  var err=document.createElement("div");
  err.style.cssText="min-height:18px;margin-top:10px;font-size:12.5px;color:#DC2626;font-weight:600;";
  card.appendChild(inp);card.appendChild(btn);card.appendChild(err);
  wrap.appendChild(card);document.body.appendChild(wrap);
  function fail(m){err.textContent=m;inp.value="";inp.focus();}
  function submit(){
    var v=inp.value||""; if(!v){return;}
    if(!(window.crypto&&window.crypto.subtle)){fail("Contexte non sécurisé — HTTPS requis.");return;}
    window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(v)).then(function(buf){
      if(_hex(buf)===GATE_HASH){
        try{sessionStorage.setItem("mi_unlocked","1");}catch(e){}
        var g=document.getElementById("mi-gate"); if(g&&g.parentNode){g.parentNode.removeChild(g);}
        runApp();
      } else { fail("Mot de passe incorrect / Incorrect password"); }
    }).catch(function(){ fail("Erreur de vérification."); });
  }
  btn.onclick=submit;
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){submit();} });
  setTimeout(function(){try{inp.focus();}catch(e){}},50);
}

try{
  if(sessionStorage.getItem("mi_unlocked")==="1"){ runApp(); }
  else { _mkGate(); }
}catch(e){ _mkGate(); }
