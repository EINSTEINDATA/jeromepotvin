/* ---------- longueurs ---------- */
function drawLon(){
  document.getElementById('th-lon').innerHTML =
    `<th>${t('th_case')}<small>${t('th_case_s')}</small></th>` +
    `<th class="dth">${t('th_dtprod')}<small>${other('th_dtprod')} · PSB</small></th>` +
    `<th class="dth">${t('th_dtlen')}<small>${other('th_dtlen')} · pi/ft</small></th>` +
    DATA.brandKeys.map(k => {
      const [nm, fam] = DATA.brandLabel[k];
      return `<th>${esc(nm.split(' /')[0])}<small>${fam}</small></th>`;
    }).join('') +
    `<th class="dth">${t('th_dtpos')}<small>${other('th_dtpos')} · ${t('th_dtpos_s')}</small></th>` +
    `<th>${t('th_gapc')}<small>${t('th_gapc_s')}</small></th>` +
    `<th>${t('th_refsc')}<small>${t('th_refs_s')}</small></th>`;

  const q = qLon.value.trim().toLowerCase();
  const rows = DATA.rows.filter(r =>
    (F.v === null || r.v === F.v) && (F.w === null || r.w === F.w) &&
    (F.t === null || r.t === F.t) && (F.b === null || r.b === F.b) &&
    (!q || (Object.values(r.codes).join(' ') + ' ' +
            DATA.dtCode[String(r.v)].replace('{n}', r.w)).toLowerCase().includes(q)));

  const unit = L ? 'W/ft' : 'W/pi';
  document.getElementById('tb-lon').innerHTML = rows.map(r => {
    const vals = DATA.brandKeys.map(k => r[k]).filter(v => v != null);
    const mx = Math.max(...vals), mn = Math.min(...vals);
    const cls = r.t === 50 ? 't50' : r.t === 0 ? 't0' : r.t === -20 ? 'tm20' : 'tm40';
    const cells = DATA.brandKeys.map(k => {
      const nm = DATA.brandLabel[k][0].split(' /')[0], v = r[k];
      if (v == null)
        return `<td class="cell nil" data-l="${esc(nm)}" title="${esc(t('tip_nil'))}">${t('nil')}</td>`;
      const best = v === mx && vals.length > 1 ? ' best' : '';
      return `<td class="cell${best}" data-l="${esc(nm)}">` +
             `<span class="bar-fill" style="width:${Math.round(v / mx * 100)}%"></span>` +
             `<span>${v}</span></td>`;
    }).join('');
    const gap = vals.length > 1 ? (mx - mn) / mn : null;
    const gapCell = gap === null
      ? `<td class="cell nil" data-l="${t('th_gapc')}">${t('nil')}</td>`
      : `<td class="pct ${gap >= 0.10 ? 'wide' : 'tight'}" data-l="${t('th_gapc')}">${(gap*100).toFixed(0)}&nbsp;%</td>`;
    const dtc = DATA.dtCode[String(r.v)].replace('{n}', r.w);
    return `<tr class="${cls}">
      <td class="key" data-l="${t('th_case')}">${r.w} ${unit} &middot; ${r.v} V &middot; ${r.t}&deg;F &middot; ${r.b} A</td>
      <td class="dtcode" data-l="${t('th_dtprod')} / ${other('th_dtprod')}" title="${esc(t('lg_dtcode'))}">${esc(dtc)}</td>
      <td class="cell dt" data-l="${t('th_dtlen')} / ${other('th_dtlen')}" title="${esc(t('tip_dt'))}">${t('cell_fill')}</td>
      ${cells}
      <td class="cell dt" data-l="${t('th_dtpos')} / ${other('th_dtpos')}" title="${esc(t('tip_dt'))}">${t('dt_pending')}</td>
      ${gapCell}
      <td class="codes" data-l="${t('th_refsc')}">${DATA.brandKeys.map(k => esc(r.codes[k])).join(' &nbsp;·&nbsp; ')}</td></tr>`;
  }).join('');

  set('c-lon', t('count_lon').replace('{n}', rows.length).replace('{tot}', DATA.rows.length));
  document.getElementById('e-lon').innerHTML = rows.length ? ''
    : `<div class="empty">${esc(t('empty_lon'))}</div>`;
}

/* ---------- équivalences ---------- */
function drawEq(){
  const q = qEq.value.trim().toLowerCase();
  const items = DATA.equiv.filter(e => !q ||
    (e.fn[L] + ' ' + e.dt[L] + ' ' + e.cells.map(c => c[L]).join(' ') + ' ' + e.note[L] + ' ' +
     e.brands.join(' ')).toLowerCase().includes(q));
  const secs = [...new Set(items.map(e => e.sec))];
  const wrap = document.getElementById('wrap-eq');
  wrap.innerHTML = secs.map(s => {
    const list = items.filter(e => e.sec === s);
    return `<div class="sec-head"><h3>${esc(DATA.sections[s][L])}</h3>` +
      `<span class="n">${t('eq_rows').replace('{n}', list.length)}</span></div>` +
      list.map(e => {
        const slots = e.brands.map((b, i) => {
          const txt = e.cells[i][L];
          const absent = txt.trim().replace(/\.$/, '').toLowerCase() === t('absent').toLowerCase();
          return `<div class="slot${absent ? ' absent' : ''}"><h4>${esc(b)}</h4><p>${esc(txt)}</p></div>`;
        }).join('');
        return `<div class="card"><div class="fn">${esc(e.fn[L])}</div>
          <div class="grid"><div class="slot dt"><h4>${esc(t('dt_slot'))}<span>${esc(other('dt_slot'))}</span></h4><p>${esc(e.dt[L])}</p></div>${slots}</div>
          <div class="note"><b>${esc(t('eq_note_lbl'))}</b> ${esc(e.note[L])}</div></div>`;
      }).join('');
  }).join('');
  set('c-eq', t('count_eq').replace('{n}', items.length).replace('{tot}', DATA.equiv.length));
  if (!items.length) wrap.innerHTML = `<div class="empty">${esc(t('empty_eq'))}</div>`;
}

/* ---------- tableau AX-03-22 ---------- */
const famSel = document.getElementById('s-fam');
const anchSel = document.getElementById('s-anchor');
const qCh = document.getElementById('q-ch');
const ckA = document.getElementById('ck-anchor');
let anchor = 'DémoTherm';

const allBrands = () => {
  const seen = new Map();
  DATA.chart.forEach(f => f.brands.forEach(b => seen.set(b, (seen.get(b) || 0) + 1)));
  return [...seen.keys()].sort((a, b) => a.localeCompare(b, 'fr'));
};

function buildChartControls(){
  famSel.innerHTML = `<option value="">${esc(t('ch_all'))}</option>` +
    DATA.chart.map(f => `<option value="${esc(f.key)}">${esc(L ? f.en : f.fr)}</option>`).join('');
  const cur = anchSel.value || anchor;
  anchSel.innerHTML = allBrands().map(b =>
    `<option value="${esc(b)}"${b === cur ? ' selected' : ''}>${esc(b)}</option>`).join('');
  anchor = anchSel.value || anchor;
}
[famSel, anchSel].forEach(el => el.addEventListener('change', () => {
  anchor = anchSel.value; drawCh();
}));
qCh.addEventListener('input', drawCh);
ckA.addEventListener('change', drawCh);

function drawCh(){
  const q = qCh.value.trim().toLowerCase();
  const fam = famSel.value;
  const onlyA = ckA.checked;
  let shown = 0, total = 0;

  const html = DATA.chart.filter(f => !fam || f.key === fam).map(f => {
    const ai = f.brands.indexOf(anchor);
    const rows = f.rows.filter(r => {
      total++;
      if (onlyA && (ai < 0 || !r.v[ai].c)) return false;
      if (q && !r.v.map(x => x.c).join(' ').toLowerCase().includes(q)) return false;
      return true;
    });
    if (!rows.length) return '';
    shown += rows.length;
    const di = f.brands.indexOf('DémoTherm');
    let out = `<div class="fam"><h3>${esc(L ? f.en : f.fr)}</h3>` +
      `<span class="n">${t('ch_rows').replace('{n}', rows.length)}` +
      (di >= 0 ? ` &middot; ${esc(t('ch_dtflag'))}` : '') + `</span></div>`;
    let cat = null;
    rows.forEach(r => {
      if (r.cat && r.cat !== cat) { cat = r.cat; out += `<div class="catrow">${esc(cat)}</div>`; }
      const a = ai >= 0 ? r.v[ai] : null;
      const acode = a && a.c ? a.c : (a && a.d ? t('ch_none') : t('ch_blank'));
      const eqs = f.brands.map((b, i) => {
        if (i === ai) return '';
        const v = r.v[i];
        const isDT = b === 'DémoTherm';
        if (v.c) return `<div class="eq${isDT ? ' dtc' : ''}"><b>${esc(b)}</b><span>${esc(v.c)}</span></div>`;
        if (v.d)  return `<div class="eq no"><b>${esc(b)}</b><span>&mdash;</span></div>`;
        return `<div class="eq nf"><b>${esc(b)}</b><span>${esc(t('ch_blank'))}</span></div>`;
      }).join('');
      const hasDT = di >= 0 && r.v[di].c && anchor !== 'DémoTherm';
      out += `<div class="xr${hasDT ? ' hasdt' : ''}">
        <div class="anch"><span class="lbl">${esc(t('ch_anchorcol'))} &middot; ${esc(anchor)}</span>
          <span class="code">${esc(acode)}</span></div>
        <div class="eqs">${eqs}</div></div>`;
    });
    return out;
  }).join('');

  const wrap = document.getElementById('wrap-ch');
  wrap.innerHTML = html || `<div class="empty">${esc(t('ch_empty'))}</div>`;
  set('c-ch', t('ch_count').replace('{n}', shown).replace('{tot}', total));
}

/* ---------- catalogue DémoTherm ---------- */
const qDt = document.getElementById('q-dt');
const ckG = document.getElementById('ck-gap');
qDt.addEventListener('input', drawDt);
ckG.addEventListener('change', drawDt);

function drawDt(){
  const q = qDt.value.trim().toLowerCase();
  const all = DATA.master.concat(DATA.extra);
  const items = all.filter(x => {
    if (ckG.checked && !x.gap) return false;
    if (!q) return true;
    const hay = [x.dt, x.br, x.ou, x.app[L], ...x.comp.map(c => c.b + ' ' + c.c)].join(' ');
    return hay.toLowerCase().includes(q);
  });
  const wrap = document.getElementById('wrap-dt');
  wrap.innerHTML = items.length ? items.map(x => {
    const same = x.dt && x.br && x.dt === x.br;
    const cls = x.gap ? ' gap' : (x.src === 'binder' ? ' binder' : '');
    const code = x.dt || t('dt_gap');
    const meta = [];
    if (x.br) meta.push(`${esc(t('dt_britech'))} <b>${esc(x.br)}</b>`);
    if (x.ou) meta.push(`${esc(t('dt_ouellet'))} <b>${esc(x.ou)}</b>`);
    const badge = same ? `<span class="dtc-same">${esc(t('dt_same'))}</span>`
      : (x.gap ? `<span class="dtc-tag">${esc(t('dt_gap'))}</span>`
      : (x.src === 'binder' ? `<span class="dtc-tag">${esc(t('dt_binder'))}</span>` : ''));
    const body = x.comp.length
      ? x.comp.map(c => `<div class="dtc-b"><b>${esc(c.b)}</b><span>${esc(c.c)}</span></div>`).join('')
      : `<div class="dtc-b"><span>${esc(t('dt_nocomp'))}</span></div>`;
    const note = x.note ? `<div class="dtc-note">${esc(x.note[L])}</div>`
      : (x.gap ? `<div class="dtc-note">${esc(t('dt_gaptxt'))}</div>` : '');
    return `<div class="dtc-card${cls}">
      <div class="dtc-top"><span class="dtc-code">${esc(code)}</span>
        <span class="dtc-app">${esc(x.app[L])}</span>${badge}
        <span class="dtc-meta">${meta.join('<br>')}</span></div>
      <div class="dtc-body">${body}</div>${note}</div>`;
  }).join('') : `<div class="empty">${esc(t('dt_empty'))}</div>`;
  set('c-dt', t('dt_count').replace('{n}', items.length).replace('{tot}', all.length));
}

    `<span style="color:var(--copper);font-weight:700">${esc(t('lg_warn'))}</span>`;
  document.getElementById('lg-lon').innerHTML =
    [['i-bar','lg_bar'],['i-dtc','lg_dtcode'],['i-nil','lg_nil'],['i-dt','lg_dt'],['i-cold','lg_cold']]
      .map(([ic, k]) => `<span><i class="${ic}"></i>${esc(t(k))}</span>`).join('');
  SEGS.forEach(s => seg(...s));
  drawLon(); drawEq(); drawDt(); drawCh(); drawCov(); drawCo();
}

document.documentElement.lang = L ? 'en' : 'fr';
render();
</script>
</body>
