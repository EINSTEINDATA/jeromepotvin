<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-référence · câbles chauffants — DémoTherm</title>
<style>
:root{
  --steel-900:#14181d; --steel-700:#2b323a; --steel-500:#5b6672;
  --steel-300:#a8b2bc; --steel-150:#dfe4e9; --steel-100:#eceff2; --steel-50:#f6f8f9;
  --copper:#a4632c; --copper-soft:#f0e0d2;
  --cold-1:#eef3f7; --cold-2:#dce7f0; --cold-3:#c4d8e6; --cold-4:#a9c7db;
  --warn:#e0ad1f; --warn-soft:#fbf1d4;
  --paper:#fff;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:2px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--steel-50);color:var(--steel-900);font:400 15px/1.55 var(--sans)}

.bar{position:sticky;top:0;z-index:40;background:var(--steel-900);color:#fff;
  border-bottom:3px solid var(--copper)}
.bar-in{max-width:1500px;margin:0 auto;padding:14px 20px 0}
.brandline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.mark{font:700 13px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.mark em{font-style:normal;color:var(--copper)}
.tag{font:400 11px/1 var(--mono);color:var(--steel-300);letter-spacing:.04em}
.lang{margin-left:auto;display:flex;border:1px solid var(--steel-500);border-radius:var(--r);
  overflow:hidden;flex:0 0 auto}
.lang button{appearance:none;background:transparent;border:0;color:var(--steel-300);
  font:700 11px/1 var(--sans);letter-spacing:.11em;padding:7px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--copper);color:#fff}
.lang button:focus-visible{outline:2px solid var(--warn);outline-offset:-2px}
nav{display:flex;gap:2px;margin-top:14px}
nav button{appearance:none;background:transparent;border:0;border-bottom:3px solid transparent;
  color:var(--steel-300);font:700 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  padding:11px 16px;cursor:pointer;margin-bottom:-3px}
nav button:hover{color:#fff}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--copper)}
nav button:focus-visible{outline:2px solid var(--warn);outline-offset:-2px}

main{max-width:1500px;margin:0 auto;padding:26px 20px 90px}
.view[hidden]{display:none}
h2{font:700 21px/1.25 var(--sans);letter-spacing:-.01em;margin:0 0 6px}
.lede{color:var(--steel-500);font-size:14px;margin:0 0 20px;max-width:80ch}
.src{font:400 11px/1.5 var(--mono);color:var(--steel-500);margin:0 0 22px;max-width:104ch}

.filters{background:var(--paper);border:1px solid var(--steel-150);border-radius:var(--r);
  padding:14px 16px;margin-bottom:20px;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
.fgroup{display:flex;flex-direction:column;gap:7px}
.flabel{font:700 10px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--steel-500)}
.seg{display:flex;border:1px solid var(--steel-300);border-radius:var(--r);overflow:hidden}
.seg button{appearance:none;background:var(--paper);border:0;border-right:1px solid var(--steel-150);
  font:600 13px/1 var(--mono);color:var(--steel-700);padding:9px 13px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--steel-900);color:#fff}
.seg button:focus-visible{outline:2px solid var(--copper);outline-offset:-2px;z-index:1}
input[type=search]{font:400 14px/1 var(--sans);padding:10px 12px;width:min(340px,100%);
  border:1px solid var(--steel-300);border-radius:var(--r);background:var(--paper);color:var(--steel-900)}
input[type=search]:focus-visible{outline:2px solid var(--copper);outline-offset:-1px}
.count{font:400 12px/1 var(--mono);color:var(--steel-500);margin-left:auto;align-self:center}

.tblwrap{background:var(--paper);border:1px solid var(--steel-150);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1080px}
thead th{position:sticky;top:0;background:var(--steel-700);color:#fff;text-align:left;
  font:700 10px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;
  padding:11px 10px;vertical-align:bottom;border-right:1px solid var(--steel-500)}
thead th:last-child{border-right:0}
thead th small{display:block;font:400 10px/1.3 var(--mono);letter-spacing:0;text-transform:none;
  color:var(--steel-300);margin-top:3px}
tbody td{padding:0;border-bottom:1px solid var(--steel-150);border-right:1px solid var(--steel-150);
  font:400 13px/1 var(--mono);vertical-align:middle}
tbody td:last-child{border-right:0}
tbody tr.t50 .key{background:var(--cold-1)}
tbody tr.t0 .key{background:var(--cold-2)}
tbody tr.tm20 .key{background:var(--cold-3)}
tbody tr.tm40 .key{background:var(--cold-4)}
.key{padding:8px 10px;font-weight:600;white-space:nowrap}
.cell{position:relative;padding:8px 10px;text-align:right}
.cell .bar-fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--copper-soft);
  border-left:2px solid var(--copper)}
.cell span{position:relative}
.cell.best span{font-weight:700}
.cell.nil{background:repeating-linear-gradient(135deg,var(--steel-50),var(--steel-50) 5px,var(--steel-100) 5px,var(--steel-100) 10px);
  color:var(--steel-300);text-align:center}
.cell.dt{background:repeating-linear-gradient(135deg,var(--warn-soft),var(--warn-soft) 5px,#fff 5px,#fff 10px);
  color:#8a6a10;text-align:center;font-size:11px}
.pct{text-align:right;padding:8px 10px;font-weight:600}
.pct.tight{color:var(--steel-500)}
.pct.wide{color:var(--copper)}
.codes{padding:6px 10px;font:400 11px/1.45 var(--mono);color:var(--steel-500)}
.dtcode{padding:8px 10px;font:700 12px/1 var(--mono);color:#7a5c0d;background:var(--warn-soft);
  white-space:nowrap;border-right:2px solid var(--warn)!important}
thead th.dth{background:#7a5c0d}
thead th.dth small{color:#f0dca8}
.cell.dt,.dtcode{box-shadow:none}
.slot.dt h4 span{display:block;font-weight:400;letter-spacing:.08em;color:#a58a44;margin-top:3px}

.sec-head{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px;
  border-bottom:2px solid var(--steel-900);padding-bottom:7px}
.sec-head h3{font:700 15px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;margin:0}
.sec-head .n{font:400 12px/1 var(--mono);color:var(--steel-500)}
.card{background:var(--paper);border:1px solid var(--steel-150);border-radius:var(--r);
  margin-bottom:12px;overflow:hidden}
.card>.fn{background:var(--steel-100);border-bottom:1px solid var(--steel-150);
  padding:11px 15px;font:700 14px/1.3 var(--sans)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.slot{padding:13px 15px;border-right:1px solid var(--steel-150);border-bottom:1px solid var(--steel-150)}
.slot h4{margin:0 0 7px;font:700 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;
  color:var(--steel-500)}
.slot p{margin:0;font-size:13.5px;line-height:1.5;color:var(--steel-700)}
.slot.dt{background:var(--warn-soft)}
.slot.dt h4{color:#8a6a10}
.slot.absent p{color:var(--steel-300);font-style:italic}
.note{padding:12px 15px;background:var(--steel-50);border-left:3px solid var(--copper);
  font-size:13.5px;line-height:1.5;color:var(--steel-700)}
.note b{font-weight:700;color:var(--steel-900)}

.finding{background:var(--paper);border:1px solid var(--steel-150);border-radius:var(--r);
  margin-bottom:12px;display:grid;grid-template-columns:140px 1fr}
.kk{padding:14px 12px;font:700 10px/1.3 var(--sans);letter-spacing:.11em;text-transform:uppercase;
  border-right:1px solid var(--steel-150)}
.kk.verifier{background:#f7dcd2;color:#8a3413}
.kk.ecart{background:#fbe6d4;color:#8a5413}
.kk.avantage{background:#dcebe0;color:#1f5a2e}
.kk.methode{background:var(--warn-soft);color:#8a6a10}
.fbody{padding:14px 16px}
.fbody h4{margin:0 0 7px;font:700 15px/1.3 var(--sans)}
.fbody p{margin:0 0 9px;font-size:13.5px;line-height:1.55;color:var(--steel-700)}
.fbody p.act{margin:0;padding-top:9px;border-top:1px solid var(--steel-150);color:var(--steel-900)}
.fbody p.act b{font:700 10px/1 var(--sans);letter-spacing:.11em;color:var(--copper);
  display:inline-block;margin-right:6px}

.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;font:400 11.5px/1.5 var(--mono);
  color:var(--steel-500)}
.legend i{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:6px;
  border:1px solid var(--steel-300)}
.i-nil{background:repeating-linear-gradient(135deg,var(--steel-50),var(--steel-50) 4px,var(--steel-100) 4px,var(--steel-100) 8px)}
.i-dt{background:repeating-linear-gradient(135deg,var(--warn-soft),var(--warn-soft) 4px,#fff 4px,#fff 8px)}
.i-bar{background:var(--copper-soft);border-left:2px solid var(--copper)}
.i-cold{background:var(--cold-4)}
.i-dtc{background:var(--warn-soft);border-color:var(--warn)}
.empty{padding:44px 20px;text-align:center;color:var(--steel-500);background:var(--paper);
  border:1px solid var(--steel-150);border-radius:var(--r)}
select{font:600 13px/1 var(--mono);padding:9px 11px;border:1px solid var(--steel-300);
  border-radius:var(--r);background:var(--paper);color:var(--steel-900);max-width:280px}
select:focus-visible{outline:2px solid var(--copper);outline-offset:-1px}
.chk{display:flex;align-items:center;gap:8px;font:400 12.5px/1.3 var(--sans);color:var(--steel-700);
  cursor:pointer;padding-bottom:9px}
.chk input{accent-color:var(--copper);width:15px;height:15px}
.fam{margin:30px 0 12px;border-bottom:2px solid var(--steel-900);padding-bottom:7px;
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.fam h3{font:700 15px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;margin:0}
.fam .n{font:400 12px/1 var(--mono);color:var(--steel-500)}
.catrow{font:700 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;
  color:var(--copper);padding:14px 12px 6px}
.xr{background:var(--paper);border:1px solid var(--steel-150);border-radius:var(--r);
  margin-bottom:9px;display:grid;grid-template-columns:210px 1fr;align-items:stretch}
.xr.hasdt{border-left:3px solid var(--warn)}
.anch{background:var(--warn-soft);padding:12px 14px;border-right:1px solid var(--steel-150)}
.anch .lbl{font:700 9px/1 var(--sans);letter-spacing:.13em;color:#8a6a10;display:block;margin-bottom:5px}
.anch .code{font:700 15px/1.2 var(--mono);color:#5c4409;word-break:break-word}
.anch .who{font:400 10px/1.3 var(--sans);color:#a58a44;margin-top:4px;display:block}
.eqs{display:flex;flex-wrap:wrap;gap:0;padding:6px 0}
.eq{padding:6px 14px;border-right:1px solid var(--steel-150);min-width:0}
.eq:last-child{border-right:0}
.eq b{display:block;font:700 9px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--steel-500);margin-bottom:3px}
.eq span{font:600 12.5px/1.35 var(--mono);color:var(--steel-900);word-break:break-word}
.eq.dtc{background:var(--warn-soft);border-radius:var(--r)}
.eq.dtc b{color:#8a6a10}
.eq.dtc span{color:#5c4409}
.eq.no span{color:var(--steel-300);font-weight:400}
.eq.nf{background:repeating-linear-gradient(135deg,var(--steel-50),var(--steel-50) 4px,var(--steel-100) 4px,var(--steel-100) 8px)}
.eq.nf span{color:var(--steel-300);font-weight:400;font-style:italic}
.dtc-card{background:var(--paper);border:1px solid var(--steel-150);border-radius:var(--r);
  margin-bottom:11px;overflow:hidden}
.dtc-card.gap{border-color:var(--copper);border-left:4px solid var(--copper)}
.dtc-card.binder{border-left:4px solid var(--steel-300)}
.dtc-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding:12px 15px;
  background:var(--warn-soft);border-bottom:1px solid var(--steel-150)}
.dtc-card.gap .dtc-top{background:#f7e4d2}
.dtc-card.binder .dtc-top{background:var(--steel-100)}
.dtc-code{font:700 17px/1 var(--mono);color:#5c4409}
.dtc-card.gap .dtc-code{color:var(--copper)}
.dtc-app{font:600 13px/1.3 var(--sans);color:var(--steel-700)}
.dtc-meta{font:400 11px/1.4 var(--mono);color:var(--steel-500);margin-left:auto;text-align:right}
.dtc-meta b{color:#7a5c0d;font-weight:700}
.dtc-same{display:inline-block;font:700 9px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  background:var(--warn);color:#2b2000;padding:4px 7px;border-radius:var(--r)}
.dtc-tag{display:inline-block;font:700 9px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  background:var(--copper);color:#fff;padding:4px 7px;border-radius:var(--r)}
.dtc-body{display:flex;flex-wrap:wrap;padding:4px 0}
.dtc-b{padding:7px 15px;border-right:1px solid var(--steel-150)}
.dtc-b:last-child{border-right:0}
.dtc-b b{display:block;font:700 9px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--steel-500);margin-bottom:3px}
.dtc-b span{font:600 12.5px/1.35 var(--mono);color:var(--steel-900)}
.dtc-note{padding:11px 15px;background:var(--steel-50);border-left:3px solid var(--copper);
  font-size:13px;line-height:1.5;color:var(--steel-700)}
.cov{background:var(--paper);border:1px solid var(--steel-150);border-radius:var(--r);
  margin-bottom:11px;display:grid;grid-template-columns:186px 1fr}
.covk{padding:14px 12px;border-right:1px solid var(--steel-150)}
.covk .v{font:700 10px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;display:block;
  margin-bottom:7px}
.covk.complet{background:#dcebe0} .covk.complet .v{color:#1f5a2e}
.covk.trou{background:#fbe6d4} .covk.trou .v{color:#8a5413}
.covk.absent{background:var(--steel-100)} .covk.absent .v{color:var(--steel-500)}
.covk .m{font:400 11px/1.5 var(--mono);color:var(--steel-500)}
.covb{padding:14px 16px}
.covb h4{margin:0 0 7px;font:700 15px/1.3 var(--sans)}
.covb p{margin:0 0 9px;font-size:13.5px;line-height:1.55;color:var(--steel-700)}
.covb p.act{margin:0;padding-top:9px;border-top:1px solid var(--steel-150);color:var(--steel-900)}
.covb p b{font:700 10px/1 var(--sans);letter-spacing:.11em;color:var(--copper);
  display:inline-block;margin-right:6px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--steel-150);
  font:400 11.5px/1.6 var(--mono);color:var(--steel-500);max-width:104ch}

@media (max-width:760px){
  main{padding:20px 13px 70px}
  .filters{gap:15px;padding:12px}
  .count{margin-left:0;width:100%}
  .finding{grid-template-columns:1fr}
  .xr{grid-template-columns:1fr}
  .cov{grid-template-columns:1fr}
  .covk{border-right:0;border-bottom:1px solid var(--steel-150)}
  .dtc-meta{margin-left:0;text-align:left;width:100%}
  .anch{border-right:0;border-bottom:1px solid var(--steel-150)}
  select{max-width:100%}
  .kk{border-right:0;border-bottom:1px solid var(--steel-150);padding:9px 14px}
  .tblwrap{border:0;background:transparent;overflow:visible}
  table{min-width:0}
  thead{display:none}
  tbody tr{display:block;background:var(--paper);border:1px solid var(--steel-150);
    border-radius:var(--r);margin-bottom:9px;padding:4px 0}
  tbody td{display:flex;justify-content:space-between;align-items:center;gap:14px;
    border:0;border-bottom:1px solid var(--steel-100);padding:7px 12px}
  tbody tr td:last-child{border-bottom:0}
  tbody td::before{content:attr(data-l);font:700 9.5px/1.3 var(--sans);letter-spacing:.1em;
    text-transform:uppercase;color:var(--steel-500);flex:0 0 auto}
  tbody tr.t50 .key,tbody tr.t0 .key,tbody tr.tm20 .key,tbody tr.tm40 .key{background:transparent}
  .key{font-size:14px}
  tbody tr.tm40{border-left:4px solid var(--cold-4)}
  tbody tr.tm20{border-left:4px solid var(--cold-3)}
  .cell{text-align:right}
  .cell .bar-fill{display:none}
  .codes{display:none!important}
  .dtcode{background:transparent;border-right:0!important;justify-content:space-between}
}
@media print{
  body{background:#fff}
  .bar,nav,.filters,.lang{display:none!important}
  main{max-width:none;padding:0}
  .view[hidden]{display:block!important}
  .tblwrap{overflow:visible;border:0}
  table{min-width:0;font-size:9pt}
  thead th{position:static;background:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cell .bar-fill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card,.finding{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brandline">
      <span class="mark"><span id="m-a">Cross-référence</span> <em>/</em> <span id="m-b">câbles chauffants</span></span>
      <span class="tag" id="m-tag"></span>
      <div class="lang" role="group" aria-label="Langue / Language">
        <button type="button" id="L-fr" aria-pressed="true">FR</button>
        <button type="button" id="L-en" aria-pressed="false">EN</button>
      </div>
    </div>
    <nav role="tablist">
      <button role="tab" id="tab-eq"  aria-selected="true"  aria-controls="v-eq"></button>
      <button role="tab" id="tab-dt"  aria-selected="false" aria-controls="v-dt"></button>
      <button role="tab" id="tab-lon" aria-selected="false" aria-controls="v-lon"></button>
      <button role="tab" id="tab-ch"  aria-selected="false" aria-controls="v-ch"></button>
      <button role="tab" id="tab-cov" aria-selected="false" aria-controls="v-cov"></button>
      <button role="tab" id="tab-co"  aria-selected="false" aria-controls="v-co"></button>
    </nav>
  </div>
</header>

<main>
<section class="view" id="v-lon" role="tabpanel" aria-labelledby="tab-lon" hidden>
  <h2 id="lon-h"></h2>
  <p class="lede" id="lon-lede"></p>
  <p class="src" id="lon-src"></p>
  <div class="filters">
    <div class="fgroup"><span class="flabel" id="lb-v"></span><div class="seg" id="f-v"></div></div>
    <div class="fgroup"><span class="flabel" id="lb-w"></span><div class="seg" id="f-w"></div></div>
    <div class="fgroup"><span class="flabel" id="lb-t"></span><div class="seg" id="f-t"></div></div>
    <div class="fgroup"><span class="flabel" id="lb-b"></span><div class="seg" id="f-b"></div></div>
    <div class="fgroup"><span class="flabel" id="lb-q"></span>
      <input type="search" id="q-lon" autocomplete="off"></div>
    <span class="count" id="c-lon"></span>
  </div>
  <div class="tblwrap"><table><thead><tr id="th-lon"></tr></thead><tbody id="tb-lon"></tbody></table></div>
  <div id="e-lon"></div>
  <div class="legend" id="lg-lon"></div>
  <p class="foot" id="lon-foot"></p>
</section>

<section class="view" id="v-eq" role="tabpanel" aria-labelledby="tab-eq">
  <h2 id="eq-h"></h2>
  <p class="lede" id="eq-lede"></p>
  <div class="filters">
    <div class="fgroup"><span class="flabel" id="lb-eq"></span>
      <input type="search" id="q-eq" autocomplete="off"></div>
    <span class="count" id="c-eq"></span>
  </div>
  <div id="wrap-eq"></div>
</section>

<section class="view" id="v-dt" role="tabpanel" aria-labelledby="tab-dt" hidden>
  <h2 id="dt-h"></h2>
  <p class="lede" id="dt-lede"></p>
  <div class="filters">
    <div class="fgroup"><span class="flabel" id="lb-dtq"></span>
      <input type="search" id="q-dt" autocomplete="off"></div>
    <div class="fgroup"><label class="chk"><input type="checkbox" id="ck-gap">
      <span id="lb-dtonly"></span></label></div>
    <span class="count" id="c-dt"></span>
  </div>
  <div id="wrap-dt"></div>
</section>

<section class="view" id="v-cov" role="tabpanel" aria-labelledby="tab-cov" hidden>
  <h2 id="cov-h"></h2>
  <p class="lede" id="cov-lede"></p>
  <div id="wrap-cov"></div>

ex/Raychem : fiche Raychem-DS-H51086-ALPX-EN · CaloMax : formulaire TEP0067 (BETX) · HeatCore : section G-8/G-9 (GAMX) · Nelson/Emerson : fiche Type DELX. Une seule longueur continue, surface isolée, disjoncteur thermomagnétique.", "Part numbers for the braid + tinned jacket tier (BOT in Norquay's chart), the PSB's tier. The jacket suffix does not change circuit length, only price and chemical resistance. Sources — Chemelex/Raychem: datasheet Raychem-DS-H51086-ALPX-EN · CaloMax: form TEP0067 (BETX) · HeatCore: section G-8/G-9 (GAMX) · Nelson/Emerson: Type DELX datasheet. One continuous length, insulated surface, thermal-magnetic breaker."], "f_v": ["Tension", "Voltage"], "f_w": ["Sortie W/pi", "Output W/ft"], "f_t": ["Démarrage °F", "Start-up °F"], "f_b": ["Disjoncteur", "Breaker"], "f_code": ["Chercher un code", "Search a part number"], "f_code_ph": ["BETX 5-2, GAMX10, ALPX…", "BETX 5-2, GAMX10, ALPX…"], "f_all": ["Tous", "All"], "th_case": ["Cas", "Case"], "th_case_s": ["W/pi · V · °F · A", "W/ft · V · °F · A"], "th_dt": ["DémoTherm", "DémoTherm"], "th_gap": ["Écart", "Spread"], "th_gap_s": ["meilleur / pire", "best / worst"], "th_refs": ["Références", "Part numbers"], "th_refs_s": ["par marque", "by brand"], "cell_fill": ["à remplir", "to fill in"], "count_lon": ["{n} cas sur {tot}", "{n} of {tot} cases"], "empty_lon": ["Aucun cas ne correspond. Élargis les filtres ou vide la recherche.", "No case matches. Widen the filters or clear the search."], "lg_bar": ["longueur relative au meilleur de la ligne", "length relative to the best in the row"], "lg_nil": ["valeur non publiée sur la fiche", "value not published on the datasheet"], "lg_dt": ["à remplir depuis le classeur DT", "to fill in from the DT binder"], "lg_cold": ["démarrage à −40 °F : seuls Chemelex et CaloMax le publient", "−40 °F start-up: only Chemelex and CaloMax publish it"], "lon_foot": ["HeatCore inscrit « NR » quand la longueur maximale est déjà atteinte à un calibre inférieur. Ces cases portent ici le plafond réel du câble : un NR ne veut pas dire « plus long », il veut dire « plafond atteint ». La famille GAMX-2 est homologuée 208-277 V — à 208 V la sortie chute de 13 à 20 %, ce qui change la longueur utile.", "HeatCore marks “NR” where the maximum length is already reached at a smaller breaker size. Those cells carry the cable's true ceiling here: NR does not mean “longer,” it means “ceiling reached.” The GAMX-2 family is rated 208-277 V — at 208 V the output drops 13 to 20 %, which changes the usable length."], "nil": ["non publié", "not published"], "tip_nil": ["Valeur non publiée sur la fiche du fabricant", "Value not published on the manufacturer's datasheet"], "tip_dt": ["À remplir depuis le classeur produit DT", "To fill in from the DT product binder"], "eq_h": ["Équivalences par application et par fonction", "Equivalents by application and by function"], "eq_lede": ["Plancher radiant et contrôles dans une seule vue. Correspondance fonctionnelle : même rôle, même créneau — ce n'est pas une attestation d'interchangeabilité. Les homologations CSA et UL portent sur le système complet, câble et trousses de raccordement du même fabricant.", "Radiant floor and controls in a single view. Functional match: same role, same niche — this is not a certification of interchangeability. CSA and UL approvals cover the complete system, cable plus connection kits from the same manufacturer."], "eq_search": ["Chercher", "Search"], "eq_ph": ["membrane, panneau, GFEP, ITLS…", "membrane, panel, GFEP, ITLS…"], "count_eq": ["{n} lignes sur {tot}", "{n} of {tot} rows"], "empty_eq": ["Aucune ligne ne correspond. Essaie un autre mot.", "No row matches. Try another word."], "eq_rows": ["{n} lignes", "{n} rows"], "eq_note_lbl": ["Ce qui se joue ici —", "What's at stake here —"], "absent": ["Absent", "Absent"], "co_h": ["Constats", "Findings"], "co_lede": ["Ce que les données révèlent, et ce qu'il faut régler avant de diffuser l'outil aux équipes.", "What the data reveals, and what to settle before releasing this tool to the teams."], "k_verifier": ["À vérifier", "To verify"], "k_ecart": ["Écart", "Gap"], "k_avantage": ["Avantage", "Advantage"], "k_methode": ["Méthode", "Method"], "act": ["À FAIRE", "ACTION"], "lang_lbl": ["Langue", "Language"], "th_dtprod": ["ÉQUIVALENT DELTA-THERM", "DELTA-THERM EQUIVALENT"], "th_gapc": ["Écart concurrents", "Competitor spread"], "th_gapc_s": ["meilleur / pire concurrent", "best / worst competitor"], "th_dtpos": ["DT vs meilleur concurrent", "DT vs best competitor"], "th_dtpos_s": ["+ = DT plus long", "+ = DT runs longer"], "th_refsc": ["Références concurrents", "Competitor part numbers"], "lg_dtcode": ["code DT issu de l'analyse du classeur — à confirmer", "DT part number from the binder analysis — to be confirmed"], "lg_warn": ["⚠ colonne HeatCore sous réserve : Norquay vise SLR-CT, pas GAMX", "⚠ HeatCore column reserved: Norquay points to SLR-CT, not GAMX"], "dt_pending": ["en attente", "pending"], "th_dtlen": ["DELTA-THERM — longueur", "DELTA-THERM — length"], "dt_slot": ["ÉQUIVALENT DELTA-THERM", "DELTA-THERM EQUIVALENT"], "dt_block": ["Colonnes DémoTherm", "DémoTherm columns"], "nav_ch": ["Toutes catégories (Norquay)", "All categories (Norquay)"], "ch_h": ["Tableau de correspondance Norquay AX-03-22", "Norquay AX-03-22 cross-reference chart"], "ch_lede": ["Le tableau d'Norquay, intégré tel quel — 101 lignes, 9 familles de produits, 70 marques. Il est bâti autour d'Norquay, mais le sélecteur d'ancrage permet de le faire pivoter : choisissez DémoTherm et c'est notre code qui passe en première colonne, avec les concurrents en regard.", "Norquay's chart, integrated as it stands — 101 rows, 9 product families, 70 brands. It is built around Norquay, but the anchor selector lets you pivot it: choose DémoTherm and our part number moves to the first column, with the competitors alongside."], "ch_src": ["Source — AX-03-22, Tableau de correspondance / Cross reference chart, Norquay Canada inc. Métadonnées du fichier : créé le 26 novembre 2019, dernière modification le 2 mars 2026. Document courant. Quelques mentions de propriété des en-têtes sont restées périmées : « PolarTech (Norvex) » est devenu nVent, puis Chemelex.", "Source — AX-03-22, Tableau de correspondance / Cross reference chart, Norquay Canada inc. File metadata: created 26 November 2019, last modified 2 March 2026. A current document. A few ownership notes in the headers were left stale: “PolarTech (Norvex)” became nVent, then Chemelex."], "ch_family": ["Famille de produits", "Product family"], "ch_anchor": ["Ancrer sur", "Anchor on"], "ch_search": ["Chercher un code, toutes marques", "Search a part number, all brands"], "ch_ph": ["PSB, DTR, ALPX-CT, DITRA…", "PSB, DTR, ALPX-CT, DITRA…"], "ch_only": ["Lignes où l'ancre est renseignée", "Rows where the anchor is filled"], "ch_all": ["Toutes les familles", "All families"], "ch_none": ["aucun équivalent", "no equivalent"], "ch_blank": ["non renseigné", "not filled in"], "ch_count": ["{n} lignes sur {tot}", "{n} of {tot} rows"], "ch_empty": ["Aucune ligne ne correspond. Change de famille ou vide la recherche.", "No row matches. Change family or clear the search."], "ch_anchorcol": ["ANCRE", "ANCHOR"], "ch_dtflag": ["DémoTherm présent", "DémoTherm present"], "ch_rows": ["{n} lignes", "{n} rows"], "ch_legend": ["Un tiret veut dire qu'Norquay a inscrit « aucun équivalent ». Une case hachurée veut dire qu'elle a été laissée vide — ce n'est pas la même information.", "A dash means Norquay entered “no equivalent.” A hatched cell means it was left blank — that is not the same information."], "nav_dt": ["Catalogue DémoTherm", "DémoTherm catalogue"], "nav_cov": ["Couverture de marché", "Market coverage"], "dt_h": ["Catalogue DémoTherm — toutes les équivalences", "DémoTherm catalogue — every equivalent"], "dt_lede": ["Une entrée par câble DémoTherm ou Britech relevé au tableau d'Norquay, plus les produits portés au classeur DT que le tableau ne connaît pas. Le code Britech est affiché à côté du code DT : quand les deux sont identiques, c'est le même câble.", "One entry per DémoTherm or Britech cable found in Norquay's chart, plus the products in the DT binder that the chart does not know about. The Britech code sits beside the DT code: where the two are identical, it is the same cable."], "dt_search": ["Chercher un code ou une application", "Search a part number or application"], "dt_ph": ["PSB, DTR, ELK-MI, membrane, béton…", "PSB, DTR, ELK-MI, membrane, concrete…"], "dt_only": ["Trous de gamme seulement", "Gaps only"], "dt_count": ["{n} câbles sur {tot}", "{n} of {tot} cables"], "dt_empty": ["Aucun câble ne correspond.", "No cable matches."], "dt_britech": ["Code Britech", "Britech code"], "dt_ouellet": ["Vis-à-vis Norquay", "Norquay counterpart"], "dt_same": ["code identique — même câble", "identical code — same cable"], "dt_gap": ["TROU DE GAMME", "PRODUCT GAP"], "dt_gaptxt": ["Aucun code DémoTherm à ce créneau alors que la concurrence y est.", "No DémoTherm code in this tier while the competition is present."], "dt_binder": ["Au classeur DT, absent du tableau d'Norquay", "In the DT binder, absent from Norquay's chart"], "dt_nocomp": ["Aucun équivalent concurrent identifié", "No competing equivalent identified"], "cov_h": ["Couverture de marché — les neuf catégories", "Market coverage — the nine categories"], "cov_lede": ["Ce que le tableau d'Norquay dit de notre position, catégorie par catégorie. DémoTherm couvre 16 des 101 lignes, mais 16 des 18 lignes de câble : un spécialiste du câble à couverture quasi complète, absent de tout le reste.", "What Norquay's chart says about our position, category by category. DémoTherm covers 16 of 101 rows, but 16 of the 18 cable rows: a cable specialist with near-full coverage, absent from everything else."], "cov_rows": ["{n} lignes · {b} marques", "{n} rows · {b} brands"], "cov_dt": ["DémoTherm : {n} lignes renseignées", "DémoTherm: {n} rows filled"], "cov_absent": ["DémoTherm absent", "DémoTherm absent"], "v_complet": ["COUVERTURE COMPLÈTE", "FULL COVERAGE"], "v_trou": ["UN TROU", "ONE GAP"], "v_absent": ["ABSENT", "ABSENT"], "cov_note": ["Constat", "Finding"], "cov_act": ["À faire", "Action"]}, "sections": {"floor": ["Plancher et membrane", "Floor heating and membrane"], "ctrl": ["Contrôles et panneaux", "Controls and panels"], "sr": ["Autorégulants industriels — équivalents câble à câble", "Industrial self-regulating — cable-for-cable equivalents"]}, "brandLabel": {"btv": ["POLARTECH / NORVEX", "ALPX"], "bsx": ["CALOMAX", "BETX"], "srl": ["HEATCORE", "GAMX ⚠"], "lt": ["ARCTA (Vendex)", "DELX"]}, "brandKeys": ["btv", "bsx", "srl", "lt"], "dtCode": {"120": "{n}DTF1", "240": "{n}DTF2"}, "equiv": [{"sec": "sr", "brands": ["PolarTech / Norvex", "CaloMax", "HeatCore", "Arcta (Vendex)"], "fn": ["Basse température — maintien jusqu'à 65 °C", "Low temperature — maintain up to 65 °C"], "dt": ["PSB — 3, 5, 8 et 10 W/pi. PSB1 en 120 V, PSB2 en 240 V. Correspond au créneau tresse + gaine étamée (BOT) du tableau d'Norquay. Aucun équivalent DT inscrit au créneau tresse simple (BO).", "PSB — 3, 5, 8 and 10 W/ft. PSB1 at 120 V, PSB2 at 240 V. Matches the braid + tinned jacket (BOT) tier in Norquay's chart. No DT entry appears in the plain braid (BO) tier."], "cells": [["ALPX — 3ALPX, 5ALPX, 8ALPX, 10ALPX. Le tableau d'Norquay vise le ALPX-CT en face du PSB, pas le ALPX-CR : le -CT est la gaine étamée. Aussi GM-2XT et XL-CT. Maintien 65 °C, exposition intermittente 85 °C, T6.", "ALPX — 3ALPX, 5ALPX, 8ALPX, 10ALPX. Norquay's chart puts ALPX-CT opposite the PSB, not ALPX-CR: -CT is the tinned jacket. Also GM-2XT and XL-CT. 65 °C maintain, 85 °C intermittent exposure, T6."], ["BETX — BETX 3, 5, 8 et 10, suffixes -1 et -2 pour la tension. Le tableau d'Norquay vise le BETX-FOJ et le D1-BETX en face du PSB. Maintien 65 °C.", "BETX — BETX 3, 5, 8 and 10, suffixes -1 and -2 for voltage. Norquay's chart puts BETX-FOJ and D1-BETX opposite the PSB. 65 °C maintain."], ["À VÉRIFIER. Le tableau d'Norquay inscrit SLR-CT et HSRL-CT en face du PSB, pas GAMX. Or c'est le GAMX qui porte les tables de longueurs de circuit utilisées ici. SLR contre GAMX : soit deux familles distinctes, soit une inversion de lettres dans le tableau d'Norquay.", "TO VERIFY. Norquay's chart lists SLR-CT and HSRL-CT opposite the PSB, not GAMX. Yet GAMX is the family whose circuit-length tables are used here. SLR against GAMX: either two distinct families, or a letter transposition in Norquay's chart."], ["DELX — DELX3, DELX5, DELX8, DELX10 en 120 V; DELX23, DELX25, DELX28, DELX210 en 240 V. Norquay inscrit CLT-JT en face du PSB. Maintien 65 °C, exposition intermittente 85 °C, T6 à 3 et 5 W/pi, T5 à 8 et 10 W/pi.", "DELX — DELX3, DELX5, DELX8, DELX10 at 120 V; DELX23, DELX25, DELX28, DELX210 at 240 V. 65 °C maintain, 85 °C intermittent exposure, T6 at 3 and 5 W/ft, T5 at 8 and 10 W/ft."]], "note": ["La transposition la plus propre du portefeuille : la nomenclature se lit 1 pour 1. 5PSB2-CR équivaut à 5ALPX2-CR, à BETX 5-2-OJ et à GAMX5-2CR — même sortie, même tension, même type de gaine. C'est la famille où une substitution se défend le plus facilement, et aussi celle où un concurrent peut nous substituer le plus facilement. Réserve sur la colonne HeatCore : voir la case.", "The cleanest transposition in the portfolio: the part numbering reads one for one. 5PSB2-CR matches 5ALPX2-CR, BETX 5-2-OJ and GAMX5-2CR — same output, same voltage, same jacket type. This is the family where a substitution is easiest to defend, and also the one where a competitor can most easily substitute us. Reservation on the HeatCore column: see the cell."]}, {"sec": "sr", "brands": ["PolarTech / Norvex", "CaloMax", "HeatCore", "Arcta (Vendex)"], "fn": ["Température moyenne — procédé et vapeur légère", "Medium temperature — process and light steam"], "dt": ["MSB — codes de tension MSB1 et MSB2. Attention : la fiche du classeur porte par erreur « HSB1 / HSB2 » à cet endroit.", "MSB — MSB1 and MSB2 voltage codes. Note: the binder datasheet mistakenly prints “HSB1 / HSB2” here."], "cells": [["QTVR", "QTVR"], ["SRX / RSX — gamme procédé", "SRX / RSX — process range"], ["SRP", "SRP"], ["QLT — QLT10, QLT15, QLT20 et versions 240 V, maintien 121 °C", "QLT — QLT10, QLT15, QLT20 and 240 V versions, 121 °C maintain"]], "note": ["Correspondance MSB ↔ QTVR ↔ SRP confirmée à l'analyse du classeur. L'équivalent Nelson est le QLT par la plage de température, à confirmer sortie par sortie. La coquille de tension sur la fiche MSB est à corriger avant toute diffusion : une erreur de tension sur une fiche technique fragilise le document entier.", "The MSB ↔ QTVR ↔ SRP match is confirmed from the binder analysis. The Nelson equivalent is the QLT by temperature range, to be confirmed output by output. The voltage typo on the MSB datasheet must be fixed before any release: a voltage error on a datasheet undermines the whole document."]}, {"sec": "sr", "brands": ["PolarTech / Norvex", "CaloMax", "HeatCore", "Arcta (Vendex)"], "fn": ["Haute température — maintien jusqu'à 121 °C", "High temperature — maintain up to 121 °C"], "dt": ["HSB — codes de tension HSB1 et HSB2", "HSB — HSB1 and HSB2 voltage codes"], "cells": [["XTV", "XTV"], ["HTSX", "HTSX"], ["SRM/E et HSRM", "SRM/E and HSRM"], ["HLT — HLT5, HLT10, HLT15, HLT20 en 120 V; HLT25 à HLT220 en 240 V. Maintien 121 °C, exposition intermittente 191 °C, T3.", "HLT — HLT5, HLT10, HLT15, HLT20 at 120 V; HLT25 to HLT220 at 240 V. 121 °C maintain, 191 °C intermittent exposure, T3."]], "note": ["Correspondance HSB ↔ XTV ↔ HTSX confirmée à l'analyse du classeur. Au-delà de 121 °C, c'est le SR-SH+ de DT qui prend le relais avec un maintien de 185 °C : aucun autorégulant concurrent identifié n'y monte — le KTV plafonne à 150 °C, le SRM/E à 150 °C, le HTSX et le QLT à 121 °C. C'est l'argument technique le plus fort du portefeuille.", "The HSB ↔ XTV ↔ HTSX match is confirmed from the binder analysis. Above 121 °C, DT's SR-SH+ takes over with a 185 °C maintain temperature: no competing self-regulating cable identified reaches it — KTV caps at 150 °C, SRM/E at 150 °C, HTSX and QLT at 121 °C. This is the strongest technical argument in the portfolio."]}, {"sec": "sr", "brands": ["PolarTech / Norvex", "CaloMax", "HeatCore", "Arcta (Vendex)"], "fn": ["Puissance limitée — longues conduites", "Power-limiting — long lines"], "dt": ["BPL", "BPL"], "cells": [["VPL", "VPL"], ["HPT", "HPT"], ["Absent.", "Absent."], ["Absent.", "Absent."]], "note": ["Correspondance BPL ↔ VPL ↔ HPT confirmée à l'analyse du classeur. Ni HeatCore ni Nelson n'ont de réponse identifiée sur ce créneau : à vérifier, parce que si ça tient c'est un argument de couverture de gamme face à deux des quatre grands.", "The BPL ↔ VPL ↔ HPT match is confirmed from the binder analysis. Neither HeatCore nor Nelson has an identified answer in this niche: worth verifying, because if it holds it is a range-coverage argument against two of the four majors."]}, {"sec": "floor", "brands": ["Fondera", "FlexWarm", "Norquay"], "fn": ["Membrane de désolidarisation avec câble", "Uncoupling membrane with cable"], "dt": ["DTR — confirmé par le tableau AX-03-22 d'Norquay, en vis-à-vis direct du DITRA-HEAT-E-HK.", "DTR — confirmed by Norquay's AX-03-22 chart, directly opposite DITRA-HEAT-E-HK."], "cells": [["DITRA-HEAT (membrane) avec câble DITRA-HEAT-E-HK, paire torsadée, 120 V et 240 V. Le câble s'encliquette dans les plots : ni attaches, ni autonivelant. Pose à 3 plots (3 1/2 po). Thermostats DITRA-HEAT-E-RSD et Wi-Fi. Certifié CSA, garantie de 10 ans sur le système.", "DITRA-HEAT (membrane) with DITRA-HEAT-E-HK twisted-pair cable, 120 V and 240 V. The cable snaps into the studs: no clips, no self-leveller. Installed at 3-stud spacing (3 1/2 in). DITRA-HEAT-E-RSD and Wi-Fi thermostats. CSA certified, 10-year system warranty."], ["Green Cable Surface XL, 3,6 W/pi — format conçu pour les systèmes à membrane. Jauge Snap-in universelle et système FLEXSnap+. Céramique et pierre naturelle.", "Green Cable Surface XL, 3.6 W/ft — format designed for membrane systems. Universal Snap-in gauge and FLEXSnap+ installation system. Ceramic and natural stone."], ["Série OTR, câble de plancher pour membrane. Double conducteur, isolant fluoropolymère, gaine métallique de mise à la terre, enveloppe de PVC. Entraxe minimal de 3 po.", "OTR series, floor heating cable for membrane. Dual conductor, fluoropolymer insulation, metallic sheath for grounding, PVC outer jacket. Minimum 3 in spacing."]], "note": ["Correction : DT a bien une réponse membrane, le DTR. Le tableau d'Norquay l'aligne avec le DITRA-HEAT-E-HK, le NUHEAT Cable, le HGS de FlexWarm et Solenne, le CGS de PureComfort et le Warmfeet CWC de Novaheat. Le combat n'est donc pas un trou de gamme mais un combat de spécification : Fondera gagne par la désolidarisation, pas par le chauffage.", "Fondera owns the specification through the membrane, not through the heating: the tile setter buys DITRA-HEAT to protect the ceramic and takes whatever cable goes with it. Correction: DT does have a membrane answer, the DTR. Norquay's chart lines it up against DITRA-HEAT-E-HK, NUHEAT Cable, the HGS from FlexWarm and Solenne, PureComfort's CGS and Novaheat's Warmfeet CWC. So this is not a product gap but a specification fight: Fondera wins through uncoupling, not through heating."]}, {"sec": "floor", "brands": ["Fondera", "FlexWarm", "Norquay"], "fn": ["Natte ou treillis sur béton", "Mat or mesh in concrete"], "dt": ["DWC-M pour le béton sur treillis. Le FHM est un produit distinct — la natte de plancher, vis-à-vis de l'OTM d'Norquay.", "DWC-M for concrete on mesh. FHM is a separate product — the floor mat, opposite Norquay's OTM."], "cells": [["Absent. Fondera ne joue pas le béton.", "Absent. Fondera does not play in concrete."], ["Green Cable Concrete, série GC : 15 W/pi² à 4 po d'entraxe, 10 W/pi² à 6 po. 240 V.", "Green Cable Concrete, GC series: 15 W/ft² at 4 in spacing, 10 W/ft² at 6 in. 240 V."], ["Série OWC-M (béton sur treillis) et OWC-R (béton en rouleau).", "OWC-M series (concrete on mesh) and OWC-R (concrete in roll form)."]], "note": ["Dalle neuve et sous-sol. La bataille se joue sur le prix au pied carré et la disponibilité chez le distributeur, pas sur la technologie.", "New slab and basement work. The fight is over price per square foot and distributor availability, not technology."]}, {"sec": "floor", "brands": ["Fondera", "FlexWarm", "Norquay"], "fn": ["Câble avec gabarit ou sangles", "Cable with strapping or guides"], "dt": ["DWF-R. Le FHTC porté au classeur est le code Britech du même produit — deux générations de nomenclature, pas deux produits.", "DWF-R. The FHTC in the binder is Britech's code for the same product — two generations of part numbering, not two products."], "cells": [["Absent.", "Absent."], ["Green Cable Surface, 3 W/pi linéaire. GS120K0424 : 424 pi, 1270 W, 10,6 A, 120 V, couvre 109,2 pi² à 3 po ou 143 pi² à 4 po. Gabarits, colle et guide dans la boîte.", "Green Cable Surface, 3 W/linear ft. GS120K0424: 424 ft, 1270 W, 10.6 A, 120 V, covers 109.2 ft² at 3 in or 143 ft² at 4 in. Guides, glue sticks and manual in the box."], ["Série OWF-R, câble pour pose sur gabarit.", "OWF-R series, cable for installation on guides."]], "note": ["FlexWarm livre la boîte complète. C'est ce que l'électricien résidentiel veut : une seule référence à commander, rien à assembler.", "FlexWarm ships the complete box. That is what the residential electrician wants: one part number to order, nothing to assemble."]}, {"sec": "floor", "brands": ["Fondera", "FlexWarm", "Norquay"], "fn": ["Fonte de neige en tapis", "Snow melting mat"], "dt": ["DWS-T (600 V) et TXLP1", "DWS-T (600 V) and TXLP1"], "cells": [["Absent.", "Absent."], ["Câbles de dégivrage autorégulants ProtecTHERM : préassemblés série CS0, ou coupés sur mesure série PTPR. Distribués par Solenne. 120 V avec fiche et lampe témoin, 240 V à raccorder.", "ProtecTHERM self-regulating de-icing cables: pre-assembled CS0 series, or cut-to-length PTPR series. Distributed through Solenne. 120 V with plug and pilot light, 240 V hard-wired."], ["Série OWS-T, câble de fonte de neige en tapis.", "OWS-T series, snow melting cable in mat form."]], "note": ["Le 600 V du DWS-T est un avantage réel ici : ni FlexWarm ni Norquay ne le documentent en résidentiel-commercial léger. À exploiter sur les rampes de garage étagé et les quais de chargement.", "The 600 V rating on DWS-T is a real advantage here: neither FlexWarm nor Norquay documents it in light residential-commercial. Use it on multi-level garage ramps and loading docks."]}, {"sec": "floor", "brands": ["Fondera", "FlexWarm", "Norquay"], "fn": ["Contrôle du plancher", "Floor control"], "dt": ["À compléter depuis le classeur", "To complete from the binder"], "cells": [["DITRA-HEAT-E-RSD programmable et modèles Wi-Fi. Deux sondes de plancher fournies avec le câble.", "DITRA-HEAT-E-RSD programmable and Wi-Fi models. Two floor sensors supplied with the cable."], ["Thermostats FLEXTHERM, sonde de plancher incluse avec le thermostat.", "FLEXTHERM thermostats, floor sensor included with the thermostat."], ["OTH3600P-GA électronique programmable, TH1310WF Wi-Fi sur Neviweb, modules esclaves TR1310 au-delà de 15 A — un seul thermostat maître pour de grandes surfaces. DDFT intégré partout.", "OTH3600P-GA programmable electronic, TH1310WF Wi-Fi on Neviweb, TR1310 slave modules beyond 15 A — a single master thermostat for large areas. GFCI built into every unit."]], "note": ["Le module esclave TR1310 est l'argument technique le plus fort du lot : il règle les grandes surfaces avec un seul thermostat. Vérifier si DT a un équivalent.", "The TR1310 slave module is the strongest technical argument of the three: it solves large areas with a single thermostat. Check whether DT has an equivalent."]}, {"sec": "ctrl", "brands": ["PolarTech / Norvex", "CaloMax", "HeatCore", "Arcta (Vendex)"], "fn": ["Thermostat mécanique, sonde ambiante", "Mechanical thermostat, ambient sensing"], "dt": ["APS-3C / APS-4C (à confirmer)", "APS-3C / APS-4C (to be confirmed)"], "cells": [["AMC-1A — mécanique à détection ambiante, consigne réglable, zones non classées. Un circuit, ou plusieurs par contacteur.", "AMC-1A — mechanical ambient-sensing, adjustable set point, non-hazardous areas. One circuit, or several through a contactor."], ["Gamme mécanique offerte, modèle à confirmer auprès du représentant.", "Mechanical range offered, model to be confirmed with the representative."], ["RTAS et RTAS-EP, ambiant, bulbe et capillaire.", "RTAS and RTAS-EP, ambient, bulb and capillary."], ["Séries TA et TH.", "TA and TH series."]], "note": ["Le bas de gamme est indifférencié et se vend au prix. Aucun argument technique à bâtir ici.", "The entry level is undifferentiated and sells on price. No technical argument to build here."]}, {"sec": "ctrl", "brands": ["PolarTech / Norvex", "CaloMax", "HeatCore", "Arcta (Vendex)"], "fn": ["Thermostat mécanique, sonde de canalisation", "Mechanical thermostat, line sensing"], "dt": ["À compléter", "To complete"], "cells": [["Gamme mécanique de canalisation offerte.", "Mechanical line-sensing range offered."], ["Gamme mécanique offerte.", "Mechanical range offered."], ["RTBC et RTBC-EP, bulbe et capillaire, canalisation ou ambiant, unipolaire bidirectionnel.", "RTBC and RTBC-EP, bulb and capillary, line or ambient sensing, SPDT."], ["Séries TE et HC.", "TE and HC series."]], "note": ["HeatCore est le plus explicite sur la distinction ambiant / canalisation dans sa documentation. Un devis rédigé à partir d'un catalogue HeatCore nommera RTBC.", "HeatCore is the most explicit about the ambient / line-sensing distinction in its literature. A specification written from a HeatCore catalogue will name RTBC."]}, {"sec": "ctrl", "brands": ["PolarTech / Norvex", "CaloMax", "HeatCore", "Arcta (Vendex)"], "fn": ["Thermostat numérique 1 circuit, GFEP intégré", "Digital single-circuit thermostat, built-in GFEP"], "dt": ["PD-PRO (à confirmer)", "PD-PRO (to be confirmed)"], "cells": [["C910-485 — monopoint à microprocesseur, défaut à la terre intégré, alarmes de température haute et basse, de courant faible et de défaut à la terre, RS-485 vers la gestion d'immeuble. Bipolaire, 30 A, boîtier de PRV 8 x 10 po. Aussi RAYSTAT V5 et Elexant 450c.", "C910-485 — microprocessor-based single point, integrated ground-fault protection, high and low temperature, low current and ground-fault alarms, RS-485 to the building management system. 2-pole, 30 A, 8 x 10 in FRP enclosure. Also RAYSTAT V5 and Elexant 450c."], ["TC101 et TC201, monopoint et bipoint de la famille TraceNet.", "TC101 and TC201, single- and two-point units in the TraceNet family."], ["DTS, 30 A, un point de contrôle, démarrage progressif. DTS-HAZ pour zones classées.", "DTS, 30 A, one control point, soft start. DTS-HAZ for classified areas."], ["Contrôles thermostatiques séries TA, TH, TE et HC.", "TA, TH, TE and HC series thermostatic controls."]], "note": ["C'est le volume du marché commercial. Le démarrage progressif est le détail qui compte : il élimine l'appel de courant à froid de l'autorégulant, donc le déclenchement intempestif le matin le plus froid de l'année.", "This is the volume of the commercial market. Soft start is the detail that matters: it eliminates the cold inrush current of a self-regulating cable, and with it the nuisance trip on the coldest morning of the year."]}, {"sec": "ctrl", "brands": ["PolarTech / Norvex", "CaloMax", "HeatCore", "Arcta (Vendex)"], "fn": ["Contrôleur industriel 1-2 circuits, zone Div. 2", "Industrial 1-2 circuit controller, Div. 2 area"], "dt": ["À compléter", "To complete"], "cells": [["Elexant 4010i et 4020i, monopoint à écran tactile avec protection de défaut à la terre. Elexant 5010i, successeur du NGC-20.", "Elexant 4010i and 4020i, touchscreen single-point units with ground-fault protection. Elexant 5010i, successor to the NGC-20."], ["TC201, TC202, TCM2.", "TC201, TC202, TCM2."], ["ITC1 et ITC2 (IntelliTrace) — 1 ou 2 circuits indépendants, relais statique de 40 A par circuit à 100-277 V c.a., modes Manuel / Arrêt / Auto, PID ou tout-ou-rien, une ou deux RTD par circuit avec sélection Bas / Haut / Moyenne, démarrage progressif. Classe I Div. 2.", "ITC1 and ITC2 (IntelliTrace) — 1 or 2 independent circuits, 40 A solid-state relay per circuit at 100-277 VAC, Manual / Off / Auto modes, PID or on-off control, one or two RTDs per circuit with Low / High / Average selection, soft start. Class I Div. 2."], ["Gamme de contrôleurs électroniques offerte.", "Range of electronic controllers offered."]], "note": ["L'ITC est le produit le plus dense techniquement de cette ligne : 40 A par circuit, deux RTD, redondance de sonde. C'est la fiche qu'un ingénieur de procédé compare.", "The ITC is the most technically dense product in this line: 40 A per circuit, two RTDs, sensor redundancy. This is the datasheet a process engineer compares."]}, {"sec": "ctrl", "brands": ["PolarTech / Norvex", "CaloMax", "HeatCore", "Arcta (Vendex)"], "fn": ["Panneau multipoints, 6 à 72 circuits", "Multipoint panel, 6 to 72 circuits"], "dt": ["Panneaux GFEP (à compléter)", "GFEP panels (to complete)"], "cells": [["NGC-30 et NGC-40, panneau de 160 A / 240 V, contrôle, surveillance et distribution. ACS-30 : une interface ACS-UIT3 pilote jusqu'à 52 panneaux ACS-PCM2-5, extensible par C910-485 et modules RMM.", "NGC-30 and NGC-40, 160 A / 240 V panel, control, monitoring and distribution. ACS-30: one ACS-UIT3 interface drives up to 52 ACS-PCM2-5 power panels, extendable with C910-485 units and RMM remote monitoring modules."], ["TraceNet Genesis (panneau intégré précâblé), TCM18, TC1818. Contrôle proportionnel ambiant, module déportable en champ pour réduire le câblage.", "TraceNet Genesis (integrated pre-wired panel), TCM18, TC1818. Ambient proportional control, field-mountable module to reduce wiring."], ["ITLS et ITAS — 6 à 36 circuits extensibles à 72, relais statique de 40 A par circuit, écran tactile de 10 po (15 po en option), GFEP de 30 mA, RS-485 Modbus et Ethernet, cartographie de sondes, NEMA 4 (4X inox en option), UL et cUL. Versions ITASC1D2 et ITLSC1D2 pour Classe I Div. 2 : 2 à 48 boucles extensibles à 72, service de 100 à 480 V c.a.", "ITLS and ITAS — 6 to 36 circuits expandable to 72, 40 A solid-state relay per circuit, 10 in touchscreen (15 in optional), 30 mA GFEP, RS-485 Modbus and Ethernet, sensor mapping, NEMA 4 (4X stainless optional), UL and cUL. ITASC1D2 and ITLSC1D2 versions for Class I Div. 2: 2 to 48 loops expandable to 72, 100 to 480 VAC service."], ["Panneaux de contrôle, de surveillance et de puissance sur mesure.", "Custom control, monitoring and power panels."]], "note": ["L'écart le plus sérieux. Un panneau sur mesure ne peut pas être nommé dans un devis : l'ingénieur écrit ITLS ou NGC-40 parce que c'est ce qu'il peut spécifier.", "The most serious gap. A custom panel cannot be named in a specification: the engineer writes ITLS or NGC-40 because that is what he can specify."]}, {"sec": "ctrl", "brands": ["PolarTech / Norvex", "CaloMax", "HeatCore", "Arcta (Vendex)"], "fn": ["Supervision, SCADA, intégration à la GTB", "Supervision, SCADA, building-management integration"], "dt": ["Aucun équivalent identifié", "No equivalent identified"], "cells": [["Intégration BACnet et Metasys N2 par passerelle ProtoNode. RS-485 jusqu'à 1200 m.", "BACnet and Metasys N2 integration through a ProtoNode gateway. RS-485 up to 1200 m."], ["TraceNet Command pour la surveillance centralisée, et TraceView Network Explorer — un SCADA développé spécifiquement pour le traçage électrique.", "TraceNet Command for centralized monitoring, and TraceView Network Explorer — a SCADA package developed specifically for electric trace heating."], ["ISC IntelliTrace Supervisory Control, avec détection de température sans fil (WirelessHART, transmetteur 248) intégrée aux panneaux ITLS et ITAS.", "ISC IntelliTrace Supervisory Control, with wireless temperature sensing (WirelessHART, 248 transmitter) integrated into the ITLS and ITAS panels."], ["Interface vers systèmes centralisés.", "Interface to centralized systems."]], "note": ["Le sans-fil de HeatCore est le seul argument vraiment nouveau du groupe : il supprime le câblage de sonde, ce qui débloque les cas géographiquement difficiles et les mises à niveau d'installations existantes. Attendez-vous à le voir en rénovation industrielle.", "HeatCore's wireless option is the only genuinely new argument in the group: it removes sensor wiring, which unlocks geographically awkward cases and retrofits of existing installations. Expect to meet it on industrial renovation work."]}, {"sec": "ctrl", "brands": ["PolarTech / Norvex", "CaloMax", "HeatCore", "Arcta (Vendex)"], "fn": ["Logiciel de conception", "Design software"], "dt": ["Aucun logiciel identifié — tables du classeur seulement", "No software identified — binder tables only"], "cells": [["TraceCalc Pro", "TraceCalc Pro"], ["CompuTrace", "CompuTrace"], ["ChromaTrace 4", "ChromaTrace 4"], ["Outils de sélection Emerson", "Emerson selection tools"]], "note": ["Un écart stratégique, pas un détail. Le logiciel du fabricant produit la note de calcul que l'ingénieur dépose à son dossier. Des tables sur papier ne remplacent pas une note de calcul signée.", "A strategic gap, not a detail. The manufacturer's software produces the calculation record the engineer files with the project. Paper tables do not replace a signed calculation."]}, {"sec": "ctrl", "brands": ["PolarTech / Norvex", "CaloMax", "HeatCore", "Arcta (Vendex)"], "fn": ["Protection de défaut à la terre", "Ground-fault equipment protection"], "dt": ["BRI-GFI, panneaux GFEP (à confirmer)", "BRI-GFI, GFEP panels (to be confirmed)"], "cells": [["Intégrée à la plupart des contrôles et panneaux. 30 mA exigé par Chemelex.", "Built into most controls and panels. 30 mA required by Chemelex."], ["Intégrée aux panneaux TraceNet.", "Built into the TraceNet panels."], ["GFEP de 30 mA intégré aux panneaux ITLS et ITAS. Disjoncteurs thermiques de 30 mA EPD recommandés avec GAMX, SRP, SRM/E, SLL et CWM.", "30 mA GFEP built into the ITLS and ITAS panels. 30 mA EPD thermal breakers recommended with GAMX, SRP, SRM/E, SLL and CWM."], ["Exigée sur chaque circuit de dérivation. 30 mA maximum pour les câbles à construction D1.", "Required on every branch circuit. 30 mA maximum for cables with D1 construction."]], "note": ["Convergence totale : les quatre renvoient au code et pointent 30 mA. Ce n'est donc pas un différenciateur, c'est une condition d'entrée. Un concurrent qui cote un câble sans GFEP est en défaut, et c'est là que se gagne la reprise de devis.", "Total convergence: all four point to the code and to 30 mA. So it is not a differentiator, it is a condition of entry. A competitor who quotes a cable without GFEP is out of compliance, and that is where a specification gets taken back."]}], "constats": [{"k": "verifier", "t": ["Britech et DémoTherm portent les mêmes codes — ce n'est plus une hypothèse", "Britech and DémoTherm carry the same part numbers — no longer a hypothesis"], "c": ["Le tableau AX-03-22 d'Norquay met Britech et DémoTherm côte à côte, et trois produits portent un code identique dans les deux colonnes : FHM, ELK-MI et SR-PI. Deux autres ne diffèrent que par la lettre initiale — BWC-M contre DWC-M, BWC-R contre DWC-R. Britech est identifié « (Bartec) » dans l'en-tête. Ça explique aussi le chevauchement que j'avais signalé au classeur : le FHM et le FHTC sont des codes Britech, les séries DW sont la nomenclature DT. Ce sont deux générations de noms pour le même OEM, pas deux gammes.", "Norquay's AX-03-22 chart places Britech and DémoTherm side by side, and three products carry an identical code in both columns: FHM, ELK-MI and SR-PI. Two more differ only in the first letter — BWC-M against DWC-M, BWC-R against DWC-R. Britech is identified as “(Bartec)” in the header. This also explains the overlap I flagged in the binder: FHM and FHTC are Britech codes, the DW series is DT numbering. Two generations of names for one OEM, not two product lines."], "a": ["La question interne n'est plus « qui fabrique » mais « quelle exclusivité ». Un distributeur qui vend Britech, Norquay et DT a trois codes pour un câble : le seul terrain de différenciation est le prix, le stock, le service et le contrôle. Et il faut choisir une nomenclature au classeur — porter FHM et DWC-M dans le même document invite le client à poser la question.", "The internal question is no longer who manufactures but what exclusivity applies. A distributor carrying Britech, Norquay and DT has three codes for one cable: the only ground for differentiation is price, stock, service and controls. And the binder needs to settle on one numbering scheme — carrying both FHM and DWC-M in one document invites the customer to ask."]}, {"k": "avantage", "t": ["Le produit membrane DT existe : c'est le DTR", "The DT membrane product exists: it is the DTR"], "c": ["Je vous avais dit qu'aucun produit membrane n'était identifié. C'était faux. Le tableau d'Norquay aligne son OTR avec le DTR de DémoTherm, en face du DITRA-HEAT-E-HK de Fondera, du NUHEAT Cable, du HGS de FlexWarm et Solenne, du CGS de PureComfort et du Warmfeet CWC de Novaheat.", "I told you no membrane product was identified. That was wrong. Norquay's chart aligns its OTR with DémoTherm's DTR, opposite Fondera's DITRA-HEAT-E-HK, NUHEAT Cable, the HGS from FlexWarm and Solenne, PureComfort's CGS and Novaheat's Warmfeet CWC."], "a": ["Le DTR doit apparaître dans toute présentation face à un poseur de céramique. Reste à vérifier une chose qui compte plus que le câble : le DTR est-il homologué avec les membranes du marché, ou seulement avec une membrane maison. C'est ce que Fondera vend — le système, pas le fil.", "The DTR belongs in every presentation facing a tile setter. One thing still needs checking, and it matters more than the cable: is the DTR approved with the membranes on the market, or only with an in-house membrane. That is what Fondera sells — the system, not the wire."]}, {"k": "ecart", "t": ["Le pendant HeatCore du PSB est peut-être le mauvais produit", "The HeatCore counterpart to the PSB may be the wrong product"], "c": ["Le tableau d'Norquay inscrit SLR-CT et HSRL-CT en face du PSB. Les tables de longueurs de circuit intégrées à cet outil viennent du GAMX. SLR contre GAMX : ou bien ce sont deux familles HeatCore distinctes et la colonne GAMX compare le PSB au mauvais câble, ou bien c'est une inversion de lettres dans le tableau d'Norquay. Le tableau précise aussi que le vis-à-vis Raychem du PSB est le ALPX-CT et non le ALPX-CR, et que le vis-à-vis CaloMax est le BETX-FOJ ou le D1-BETX.", "Norquay's chart lists SLR-CT and HSRL-CT opposite the PSB. The circuit-length tables built into this tool come from the GAMX. SLR against GAMX: either these are two distinct HeatCore families and the GAMX column compares the PSB to the wrong cable, or it is a letter transposition in Norquay's chart. The chart also specifies that the Raychem counterpart to the PSB is ALPX-CT rather than ALPX-CR, and that the CaloMax counterpart is BETX-FOJ or D1-BETX."], "a": ["À trancher sur le catalogue HeatCore avant de se servir de la colonne GAMX en argumentaire. Les colonnes ALPX et BETX tiennent : le suffixe de gaine ne change pas la longueur de circuit, seulement le prix et la résistance chimique. La colonne HeatCore, elle, est suspendue tant que la question n'est pas réglée.", "Settle this against the HeatCore catalogue before using the GAMX column in a pitch. The ALPX and BETX columns hold: the jacket suffix does not change circuit length, only price and chemical resistance. The HeatCore column, however, is on hold until this is resolved."]}, {"k": "ecart", "t": ["DémoTherm est absent de sept des neuf familles du tableau", "DémoTherm is absent from seven of the chart's nine families"], "c": ["Norquay couvre les neuf familles : chauffage résistif de zone à 54 lignes, antidéflagrant et lavable, appareils rayonnants, plancher, câbles spécialisés, échangeurs d'air, fournaises, rideaux d'air, sèche-mains. DémoTherm n'apparaît que dans deux — plancher et câbles spécialisés. Sur ces deux-là, la couverture est bonne : 5 lignes sur 5 en plancher, 11 sur 13 en spécialisés.", "Norquay covers all nine families: resistive zone heating at 54 rows, explosion-proof and washdown, radiant heaters, floor warming, specialty cables, air exchangers, furnaces, air curtains, hand dryers. DémoTherm appears in only two — floor warming and specialty cables. On those two the coverage is good: 5 rows out of 5 on floor, 11 out of 13 on specialty."], "a": ["Ce n'est pas nécessairement une faiblesse, c'est un choix de position : Norquay est un manufacturier de chauffage électrique à gamme complète, DT est un spécialiste du câble. Mais ça dit où le devis se perd. Quand un ingénieur spécifie un bâtiment complet chez Norquay, le câble chauffant suit le reste de la commande. L'argument doit donc viser le distributeur et l'entrepreneur spécialisé, pas le donneur d'ouvrage qui achète un bâtiment.", "This is not necessarily a weakness, it is a position: Norquay is a full-line electric heating manufacturer, DT is a cable specialist. But it shows where specifications are lost. When an engineer specifies a whole building through Norquay, the heating cable follows the rest of the order. So the argument has to target the distributor and the specialist contractor, not the owner buying a building."]}, {"k": "methode", "t": ["Le tableau est à jour — ma datation était fausse", "The chart is current — my dating was wrong"], "c": ["J'avais lu « 03-22 » dans le nom du fichier comme mars 2022 et j'en avais conclu que le document avait quatre ans. Les métadonnées du fichier disent autre chose : société « Norquay Canada inc. », créé le 26 novembre 2019, dernière modification le 2 mars 2026, tenu à jour dans Excel Online sur un SharePoint. Le tableau a donc environ cinq mois, pas quatre ans. AX-03-22 est un numéro de contrôle documentaire interne d'Norquay, et le nom du fichier n'a simplement pas été renommé aux révisions suivantes — pratique courante.", "I read “03-22” in the filename as March 2022 and concluded the document was four years old. The file metadata says otherwise: company “Norquay Canada inc.,” created 26 November 2019, last modified 2 March 2026, maintained in Excel Online on a SharePoint. So the chart is about five months old, not four years. AX-03-22 is an internal Norquay document control number, and the filename simply was not changed at later revisions — common practice."], "a": ["Ne pas se servir de la date comme réfutation en réunion : elle joue contre nous. Ce tableau est du renseignement concurrentiel courant et il faut le traiter comme tel — c'est la lecture qu'Norquay fait du marché en 2026, y compris de nous. La mention périmée « PolarTech (Norvex) » reste un relâchement d'étiquetage, pas un indice de vétusté : ça vaut une phrase, pas un argument.", "Do not use the date as a rebuttal in a meeting: it works against us. This chart is current competitive intelligence and should be treated as such — it is how Norquay reads the market in 2026, including how it reads us. The stale “PolarTech (Norvex)” header is a labelling lapse, not a sign of age: worth one sentence, not an argument."]}, {"k": "verifier", "t": ["La colonne DémoTherm est vide — c'est la limite de l'outil", "The DémoTherm column is empty — that is the tool's limit"], "c": ["Les codes de produit DT sont en place : PSB en basse température, MSB en moyenne, HSB en haute, BPL en puissance limitée. Mais les valeurs de longueur maximale, elles, ne sont pas saisies : le classeur produit n'était pas disponible. Tant qu'elles manquent, la colonne « Écart concurrents » compare les concurrents entre eux, et la colonne « DT vs meilleur » reste muette.", "The DT part numbers are in place: PSB at low temperature, MSB at medium, HSB at high, BPL power-limiting. The maximum length values, however, are not entered: the product binder was not available. Until they are, the “Competitor spread” column compares competitors with each other, and the “DT vs best” column stays silent."], "a": ["Ouvrir le classeur produit aux tables de longueurs maximales du PSB et saisir les 96 valeurs dans la colonne jaune. Les deux colonnes de calcul se remplissent seules et l'outil devient une vraie cross-référence. C'est une heure de saisie, et c'est ce qui sépare un comparatif de concurrents d'un outil de vente.", "Open the product binder to the PSB maximum-length tables and enter the 96 values in the yellow column. Both calculated columns fill themselves and the tool becomes a real cross-reference. That is an hour of data entry, and it is what separates a competitor comparison from a selling tool."]}, {"k": "verifier", "t": ["La nomenclature d'Norquay est celle de DémoTherm", "Norquay's part numbering is DémoTherm's"], "c": ["Norquay catalogue OWC-M, OWC-R, OWF-R et OWS-T. Le classeur DT porte DWC-M, DWF-R et DWS-T. Lettre pour lettre, seul le préfixe change. Et un accessoire du classeur s'appelle BRI-GFI. L'hypothèse la plus simple est un fabricant commun en amont — le nom Britech vient à l'esprit — avec deux marques privées.", "Norquay catalogues OWC-M, OWC-R, OWF-R and OWS-T. The DT binder carries DWC-M, DWF-R and DWS-T. Letter for letter, only the prefix changes. And one binder accessory is called BRI-GFI. The simplest explanation is a shared upstream manufacturer — the name Britech comes to mind — behind two private labels."], "a": ["À trancher avant toute diffusion. Si l'hypothèse tient, un représentant qui attaque Norquay sur la technologie attaque le même câble dans une autre boîte, devant un distributeur qui vend les deux. L'argumentaire bascule alors sur le prix, la disponibilité, le service et le contrôle. Question interne : qui fabrique réellement les séries DW, et sous quelle exclusivité territoriale.", "Settle this before any release. If the hypothesis holds, a rep attacking Norquay on technology is attacking the same cable in a different box, in front of a distributor who sells both. The argument then shifts to price, availability, service and controls. Internal question: who actually manufactures the DW series, and under what territorial exclusivity."]}, {"k": "avantage", "t": ["Personne ne gagne sur la longueur à 5 W/pi", "Nobody wins on length at 5 W/ft"], "c": ["À 240 V, 30 A, démarrage à −20 °F : le BETX 5-2 donne 525 pi, le 5ALPX2 500 pi, le GAMX5-2C 490 pi. Sept pour cent séparent le premier du dernier, moins que l'incertitude de conception sur une vraie tuyauterie.", "At 240 V, 30 A, −20 °F start-up: BETX 5-2 gives 525 ft, 5ALPX2 500 ft, GAMX5-2C 490 ft. Seven percent separates first from last — less than the design uncertainty on real piping."], "a": ["Sortir la longueur de circuit de l'argumentaire au créneau 5 W/pi, qui fait le volume. Quand un concurrent l'utilise, montrer la ligne et rediriger vers les trousses, le délai et le coût de système.", "Take circuit length out of the pitch at the 5 W/ft tier, which is where the volume is. When a competitor raises it, show the row and redirect to connection kits, lead time and system cost."]}, {"k": "ecart", "t": ["CaloMax gagne à 3 W/pi, et l'écart est réel", "CaloMax wins at 3 W/ft, and the gap is real"], "c": ["À 240 V et 20 A, le BETX 3-2 tient 725 pi contre 660 pi pour le ALPX et le GAMX — 10 % de plus. À −40 °F le BETX 3-2 tient encore ses 725 pi à 30 A alors que le ALPX plafonne à 620 pi à 20 A. Sur une longue conduite, ce sont des circuits, des panneaux et des boîtes de raccordement en moins.", "At 240 V and 20 A, BETX 3-2 holds 725 ft against 660 ft for ALPX and GAMX — 10 % more. At −40 °F the BETX 3-2 still holds its 725 ft on a 30 A breaker while the ALPX caps at 620 ft on 20 A. On a long line, that means fewer circuits, fewer panels and fewer junction boxes."], "a": ["Préparer la réponse avant de la subir. Vérifier ce que donne le PSB à 3 W/pi et 240 V : si DT est au niveau du BETX, c'est un argument à mettre en avant. Sinon, il faut le savoir avant le client.", "Prepare the answer before you meet it. Check what the PSB does at 3 W/ft and 240 V: if DT matches the BETX, lead with it. If not, know that before the customer does."]}, {"k": "avantage", "t": ["Chemelex et CaloMax publient le −40 °F, HeatCore et Nelson non", "Chemelex and CaloMax publish −40 °F, HeatCore and Nelson do not"], "c": ["Les fiches ALPX et BETX donnent une ligne de démarrage à −40 °F. Les fiches GAMX et DELX s'arrêtent à −20 °F. Au Québec et dans le Nord, un devis peut exiger une température de démarrage documentée.", "The ALPX and BETX datasheets give a −40 °F start-up row. The GAMX and DELX datasheets stop at −20 °F. In Quebec and in the North, a specification can require a documented start-up temperature."], "a": ["Vérifier que les tables DT descendent à −40 °F. Si oui, c'est un argument documentaire gratuit contre HeatCore et Nelson, à placer sur toute soumission nordique. Sinon, c'est une lacune à corriger à la prochaine révision du classeur.", "Check that the DT tables reach −40 °F. If they do, that is a free documentary argument against HeatCore and Nelson, worth placing on every northern bid. If they do not, it is a gap to close at the next binder revision."]}, {"k": "ecart", "t": ["Le panneau multipoints est l'écart le plus sérieux", "The multipoint panel is the most serious gap"], "c": ["Chemelex, CaloMax et HeatCore ont tous un panneau catalogue avec numéro de pièce et manuel public. Le côté DT se lit comme des panneaux configurés à la demande.", "Chemelex, CaloMax and HeatCore all have a catalogue panel with a part number and a public manual. The DT side reads as panels configured on request."], "a": ["Deux options : construire une référence catalogue nommable avec des configurations figées, ou assumer le créneau et se concentrer sur le câble en acceptant que le panneau vienne d'ailleurs. Ne pas laisser la situation implicite.", "Two options: build a nameable catalogue reference with fixed configurations, or concede the niche and focus on the cable, accepting that the panel comes from elsewhere. Do not leave this implicit."]}, {"k": "ecart", "t": ["Absence de logiciel de conception", "No design software"], "c": ["TraceCalc Pro, CompuTrace et ChromaTrace produisent la note de calcul que l'ingénieur dépose à son dossier. Le classeur DT offre des tables.", "TraceCalc Pro, CompuTrace and ChromaTrace produce the calculation record the engineer files with the project. The DT binder offers tables."], "a": ["À défaut d'un logiciel, produire un chiffrier de dimensionnement DT — entrées : diamètre, isolant, température de maintien, ambiant minimal; sorties : W/pi requis, longueur de circuit, calibre de disjoncteur — avec une page imprimable signable. C'est 80 % de la valeur d'un logiciel pour une fraction de l'effort.", "Short of software, produce a DT sizing spreadsheet — inputs: diameter, insulation, maintain temperature, minimum ambient; outputs: required W/ft, circuit length, breaker size — with a printable page that can be signed. That is 80 % of the value of software for a fraction of the effort."]}, {"k": "methode", "t": ["Ce qui reste à faire", "What is still outstanding"], "c": ["Les colonnes DémoTherm de cet outil (le classeur produit est requis), les accessoires et trousses pièce à pièce, et les câbles série résistance et à isolant minéral en longueurs maximales.", "The DémoTherm columns in this tool (the product binder is required), accessories and connection kits part by part, and series-resistance and mineral-insulated cables in the maximum-length tables."], "a": ["Reverser le classeur produit et le classeur maître, et les colonnes jaunes se remplissent en une passe. La comparaison de trousses est le chantier suivant par ordre de valeur : c'est là que se joue la règle du système complet.", "Send back the product binder and the master workbook, and the yellow columns fill in one pass. The connection-kit comparison is the next job by order of value: that is where the complete-system rule is decided."]}], "chart": [{"key": "Resitive zone heating", "fr": "Chauffage résistif de zone", "en": "Resistive zone heating", "brands": ["Norquay", "Commandix", "Uniwatt", "Solenne", "HeatCore/ Dimplex", "Convectair", "Berko", "Qmark", "Farenheat", "Cadet", "King", "TPI/Markel/Raywall", "Indeeco", "Reznor"], "rows": [{"cat": "Aéroconvecteurs / Commercial fan heaters", "v": [{"c": "OAC", "d": false}, {"c": "", "d": true}, {"c": "", "d": true}, {"c": "WF", "d": false}, {"c": "RFI", "d": false}, {"c": "", "d": true}, {"c": "MFQ/VFK/ FRA", "d": false}, {"c": "CWH/LFK/ EFQ", "d": false}, {"c": "FZL", "d": false}, {"c": "", "d": true}, {"c": "LPW/EFW", "d": false}, {"c": "3310/3320", "d": false}, {"c": "WCI (932I)", "d": false}, {"c": "EHC", "d": false}]}, {"cat": "Aéroconvecteurs / Commercial fan heaters", "v": [{"c": "OACP", "d": false}, {"c": "", "d": true}, {"c": "", "d": true}, {"c": "CF", "d": false}, {"c": "", "d": true}, {"c": "", "d": true}, {"c": "QFF", "d": false}, {"c": "EFF", "d": false}, {"c": "", "d": true}, {"c": "", "d": true}, {"c": "LPWC", "d": false}, {"c": "3340/3380", "d": false}, {"c": "CCI (931I)", "d": false}, {"c": "", "d": true}]}, {"cat": "Aéroconvecteurs / Commercial fan heaters", "v": [{"c": "OAWH", "d": false}, {"c": "", "d": true}, {"c": "", "d": true}, {"c": "WFA", "d": false}, {"c": "", "d": true}, {"c": "", "d": true}, {"c": "FRC/ SSARWH", "d": false}, {"c": "AWH/SSAR", "d": false}, {"c": "", "d": true}, {"c": "", "d": true}, {"c": "LPWA/ KAWH", "d": false}, {"c": "AFA/3340/ 3450-AFH", "d": false}, {"c": "WAI (933I)", "d": false}, {"c": "EHA", "d": false}]}, {"cat": "Aérothermes / Unit heaters", "v": [{"c": "OAE", "d": false}, {"c": "", "d": true}, {"c": "", "d": true}, {"c": "RUH", "d": false}, {"c": "CUH", "d": false}, {"c": "", "d": true}, {"c": "HUH/ GH48R", "d": let L = (navigator.language || 'fr').toLowerCase().startsWith('en') ? 1 : 0;
const t = k => DATA.ui[k][L];
const other = k => DATA.ui[k][1 - L];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const set = (id, v) => { document.getElementById(id).textContent = v; };

/* ---------- langue ---------- */
['fr','en'].forEach((code, i) => {
  document.getElementById('L-' + code).addEventListener('click', () => {

    L = i;
    document.documentElement.lang = code;
    render();
  });
});

/* ---------- navigation ---------- */
const tabs = [...document.querySelectorAll('[role=tab]')];
tabs.forEach(tb => tb.addEventListener('click', () => {
  tabs.forEach(o => {
    const on = o === tb;
    o.setAttribute('aria-selected', on);
    document.getElementById(o.getAttribute('aria-controls')).hidden = !on;
  });
  window.scrollTo({top: 0});
}));

/* ---------- filtres ---------- */
const F = {v:null, w:null, t:null, b:null};
const SEGS = [
  ['f-v','v',[120,240], x => x + ' V'],
  ['f-w','w',[3,5,8,10], x => String(x)],
  ['f-t','t',[50,0,-20,-40], x => String(x)],
  ['f-b','b',[20,30,40], x => x + ' A'],
];
function seg(id, key, vals, fmt){
  const box = document.getElementById(id);
  box.innerHTML = '';
  [[t('f_all'), null], ...vals.map(x => [fmt(x), x])].forEach(([lab, val]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = lab;
    b.setAttribute('aria-pressed', F[key] === val);
    b.onclick = () => { F[key] = val; seg(id, key, vals, fmt); drawLon(); };
    box.appendChild(b);
  });
}

const qLon = document.getElementById('q-lon');
